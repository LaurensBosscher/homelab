apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: homelab
    # Selected by kube-prometheus-stack Prometheus CR
    release: prometheus
spec:
  groups:
    - name: longhorn.storage
      rules:
        - alert: LonghornNodeStorageUsageHigh
          expr: |
            100 * (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) > 85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Longhorn node {{ $labels.node }} storage >85% used
            description: Node {{ $labels.node }} Longhorn disk usage is {{ $value | printf "%.1f" }}%.
            dashboard_url: https://longhorn.bosscher.ch
        - alert: LonghornDiskUsageCritical
          expr: |
            100 * (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) > 90
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Longhorn disk {{ $labels.disk }} on {{ $labels.node }} is >90% full
            description: Disk usage is {{ $value | printf "%.1f" }}%.
            dashboard_url: https://longhorn.bosscher.ch
    - name: longhorn.backup
      rules:
        # Longhorn 1.12 exposes numeric backup_state (3=Completed, 4=Error).
        - alert: LonghornBackupFailed
          expr: longhorn_backup_state == 4
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Longhorn backup {{ $labels.backup }} failed for {{ $labels.volume }}
            description: Backup is in Error state (recurring_job={{ $labels.recurring_job }}).
            dashboard_url: https://longhorn.bosscher.ch
        # Recurring Job failures via kube-state-metrics (works without Longhorn scrape).
        - alert: LonghornRecurringJobFailed
          expr: |
            (
              kube_job_status_failed{namespace="longhorn-system", job_name=~"backup-to-backblaze-.*|daily-snapshot-cleanup-.*|weekly-fstrim-.*"} > 0
            )
            and on(namespace, job_name)
            (
              (time() - kube_job_status_start_time{namespace="longhorn-system", job_name=~"backup-to-backblaze-.*|daily-snapshot-cleanup-.*|weekly-fstrim-.*"}) < 36 * 3600
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Longhorn recurring job {{ $labels.job_name }} failed
            description: A Longhorn recurring Job failed within the last 36h.
            dashboard_url: https://longhorn.bosscher.ch
