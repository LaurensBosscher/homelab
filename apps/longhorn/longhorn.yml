apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  project: default
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: 1.12.1
      helm:
        valuesObject:
          defaultSettings:
            defaultReplicaCount: 2
            backupTarget: "s3://longhorn-backups-ay76@s3.eu-central-003/"
            backupTargetCredentialSecret: "k3s-longhorn-backup-backblaze"
          persistence:
            defaultClassReplicaCount: 2
          # Trim CSI sidecar replica counts (defaults are 3; 1 is plenty here) —
          # saves ~8 pods / ~240m CPU requests across 7 nodes
          csi:
            attacherReplicaCount: 1
            provisionerReplicaCount: 1
            resizerReplicaCount: 1
            snapshotterReplicaCount: 1
          longhornUI:
            replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
