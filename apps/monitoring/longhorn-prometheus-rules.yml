apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: homelab
    # Selected by kube-prometheus-stack Prometheus CR
    release: prometheus
spec:
  groups:
    - name: longhorn.volume
      rules:
        # Prefer label-based robustness (Longhorn >= recent 1.x); keep numeric fallback.
        - alert: LonghornVolumeFaulted
          expr: |
            (
              longhorn_volume_robustness{state="faulted"} == 1
            )
            or
            (
              longhorn_volume_robustness == 3
              unless on(volume, node) longhorn_volume_robustness{state=~".+"}
            )
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Longhorn volume {{ $labels.volume }} is faulted
            description: Volume {{ $labels.volume }} on {{ $labels.node }} reported faulted robustness.
            dashboard_url: https://longhorn.bosscher.ch
        - alert: LonghornVolumeDegraded
          expr: |
            (
              longhorn_volume_robustness{state="degraded"} == 1
            )
            or
            (
              longhorn_volume_robustness == 2
              unless on(volume, node) longhorn_volume_robustness{state=~".+"}
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Longhorn volume {{ $labels.volume }} is degraded
            description: Volume {{ $labels.volume }} on {{ $labels.node }} has been degraded for >15m.
            dashboard_url: https://longhorn.bosscher.ch
        - alert: LonghornVolumeUsageCritical
          expr: |
            100 * (longhorn_volume_usage_bytes / longhorn_volume_capacity_bytes) > 90
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Longhorn volume {{ $labels.volume }} is >90% full
            description: Volume {{ $labels.volume }} usage is {{ $value | printf "%.1f" }}%.
            dashboard_url: https://longhorn.bosscher.ch
    - name: longhorn.node
      rules:
        - alert: LonghornNodeStorageUsageHigh
          expr: |
            100 * (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) > 85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Longhorn node {{ $labels.node }} storage >85% used
            description: Node {{ $labels.node }} Longhorn disk usage is {{ $value | printf "%.1f" }}%.
            dashboard_url: https://longhorn.bosscher.ch
    - name: longhorn.backup
      rules:
        # Numeric backup_state: 4 = Error (classic). Label-based: state="error"/"Error".
        - alert: LonghornBackupFailed
          expr: |
            (
              longhorn_backup_state{state=~"(?i)error"} == 1
            )
            or
            (
              longhorn_backup_state == 4
              unless on(backup, volume, backup_volume) longhorn_backup_state{state=~".+"}
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Longhorn backup failed for {{ $labels.volume }}{{ $labels.backup_volume }}
            description: A Longhorn backup is in Error state.
            dashboard_url: https://longhorn.bosscher.ch
        # Recurring Job CronJobs that leave Failed Jobs behind (already fires as KubeJobFailed;
        # keep a focused high-signal alias for backup specifically).
        - alert: LonghornRecurringJobFailed
          expr: |
            (
              kube_job_status_failed{namespace="longhorn-system", job_name=~"backup-to-backblaze-.*|daily-snapshot-cleanup-.*|weekly-fstrim-.*"} > 0
            )
            and on(namespace, job_name)
            (
              (time() - kube_job_status_start_time{namespace="longhorn-system", job_name=~"backup-to-backblaze-.*|daily-snapshot-cleanup-.*|weekly-fstrim-.*"}) < 36 * 3600
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Longhorn recurring job {{ $labels.job_name }} failed
            description: A Longhorn recurring Job failed within the last 36h.
            dashboard_url: https://longhorn.bosscher.ch
