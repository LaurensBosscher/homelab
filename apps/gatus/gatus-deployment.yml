apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - k3s-london-1
      containers:
      - name: gatus
        image: twinproduction/gatus:v5.38.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            # cloudflare-icmp (icmp://1.1.1.1) needs a raw socket.
            add:
              - NET_RAW
        env:
        - name: TZ
          value: Europe/Zurich
        - name: GATUS_CONFIG_PATH
          value: /config/config.yaml
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-bot
              key: token
        - name: TELEGRAM_CHAT_ID
          valueFrom:
            secretKeyRef:
              name: telegram-bot
              key: chat_id
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 60
      volumes:
      - name: config
        configMap:
          name: gatus-config
      - name: data
        persistentVolumeClaim:
          claimName: gatus-data
