apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  labels:
    app: gatus
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /data/data.db

    alerting:
      telegram:
        # Values come from Secret telegram-bot (SealedSecret)
        token: "${TELEGRAM_BOT_TOKEN}"
        id: "${TELEGRAM_CHAT_ID}"
        default-alert:
          enabled: true
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true

    endpoints:
      - name: laurensbosscher.nl
        group: external
        url: "https://laurensbosscher.nl/"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"

      - name: Bosscher.ch
        group: external
        url: "https://bosscher.ch/"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"

      - name: savexcapital.com
        group: external
        url: "https://savexcapital.com/"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: homepage
        group: core
        # In-cluster call without Host returns 400; Go also ignores Host header overrides.
        url: "https://home.bosscher.ch"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: argocd
        group: cluster
        url: "https://argocd-server.argocd.svc.cluster.local"
        interval: 5m
        client:
          insecure: true
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 168h"

      - name: kite
        group: cluster
        url: "http://kite.kube-system.svc.cluster.local:8080"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"

      - name: blocky
        group: cluster
        url: "10.43.0.53"
        interval: 5m
        dns:
          query-name: example.com
          query-type: A
        conditions:
          - "[DNS_RCODE] == NOERROR"
          - "[RESPONSE_TIME] < 2000"

      - name: cluster-dns
        group: cluster
        url: "10.43.0.10"
        interval: 5m
        dns:
          query-name: example.com
          query-type: A
        conditions:
          - "[DNS_RCODE] == NOERROR"
          - "[RESPONSE_TIME] < 2000"

      - name: gatus
        group: cluster
        # Localhost avoids ClusterIP self-hairpin races right after restart.
        url: "http://127.0.0.1:8080"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"

      - name: fusion
        group: news
        url: "http://fusion.fusion.svc.cluster.local:8080"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: shiori
        group: news
        url: "http://shiori.shiori.svc.cluster.local:8080"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: wanderer
        group: productivity
        url: "http://wanderer.wanderer.svc.cluster.local:3000"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: calibre-web
        group: media
        url: "http://calibre-web.books.svc.cluster.local:8083"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: audiobookshelf
        group: media
        url: "http://audiobookshelf.audiobookshelf.svc.cluster.local:80"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: bookshelf
        group: media
        url: "http://bookshelf.bookshelf.svc.cluster.local:8787"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: aiostreams
        group: media
        url: "http://aiostreams.aiostreams.svc.cluster.local:3000"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: nzbget
        group: media
        url: "http://nzbget.nzbget.svc.cluster.local:6789"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: prowlarr
        group: media
        url: "http://prowlarr.prowlarr.svc.cluster.local:9696"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: bentopdf
        group: media
        url: "http://bentopdf.bentopdf.svc.cluster.local:8080"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: it-tools
        group: productivity
        url: "http://it-tools.it-tools.svc.cluster.local:8080"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: rdt-client
        group: media
        url: "http://rdt-client.rdt-client.svc.cluster.local:6500"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      # qbittorrent intentionally replicas:0 for now — re-enable when scaled up.

      - name: your-spotify
        group: media
        url: "http://your-spotify-web.your-spotify.svc.cluster.local:3000"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: listenarr
        group: media
        url: "http://listenarr.listenarr.svc.cluster.local:4545"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: shelfarr
        group: media
        url: "http://shelfarr.shelfarr.svc.cluster.local:8084"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: questarr
        group: media
        url: "http://questarr.questarr.svc.cluster.local:5000/api/health"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: flaresolver
        group: cluster
        url: "http://flaresolver.flaresolver.svc.cluster.local:8191"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"

      - name: backrest
        group: cluster
        url: "http://backrest.backrest.svc.cluster.local:9898"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: forgejo
        group: cluster
        url: "http://forgejo.forgejo.svc.cluster.local:3000/api/healthz"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2500"

      - name: beszel
        group: cluster
        url: "http://beszel.beszel.svc.cluster.local:8090"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"

      - name: cloudflare-icmp
        group: external
        url: "icmp://1.1.1.1"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"

      - name: obsidian-live-sync
        group: productivity
        url: "http://couchdb.obsidian-live-sync.svc.cluster.local:5984"
        interval: 5m
        conditions:
          # CouchDB requires auth even on /; 401 means the service is up.
          - "[STATUS] == 401"
          - "[RESPONSE_TIME] < 2500"
