apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  labels:
    app.kubernetes.io/name: calibre-web
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calibre-web
  template:
    metadata:
      labels:
        app: calibre-web
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - bazzite
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: calibre-web
          image: ghcr.io/crocodilestick/calibre-web-automated:v4.0.8
          # Apply the header setting before s6 starts CWA. /init must stay PID 1.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              python3 /cwa-auth/enable-proxy-auth.py
              exec /init
          ports:
            - containerPort: 8083
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Zurich
            - name: DOCKER_MODS
              value: linuxserver/mods:universal-calibre
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /calibre-library
            - name: ingest
              mountPath: /cwa-book-ingest
            - name: proxy-auth
              mountPath: /cwa-auth
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          
          livenessProbe:
            httpGet:
              path: /login
              port: 8083
            # Initial setup downloads mods and can take a while
            initialDelaySeconds: 300
            periodSeconds: 60
            timeoutSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: calibre-web-config
        - name: library
          persistentVolumeClaim:
            claimName: calibre-web-library
        - name: ingest
          persistentVolumeClaim:
            claimName: calibre-web-ingest
        - name: proxy-auth
          configMap:
            name: calibre-web-proxy-auth
