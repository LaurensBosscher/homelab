apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: calibre-web-config
      namespace: books
      labels:
        app: calibre-web
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: local-path
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: calibre-web-library
      namespace: books
      labels:
        app: calibre-web
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: local-path
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: calibre-web-ingest
      namespace: books
      labels:
        app: calibre-web
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: local-path
