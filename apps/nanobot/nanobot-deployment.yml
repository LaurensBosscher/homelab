apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanobot
  namespace: nanobot
  labels:
    app.kubernetes.io/name: nanobot
spec:
  replicas: 1
  # RWO PVC + single replica: RollingUpdate deadlocks (new pod Pending on
  # Multi-Attach while old pod holds the volume until the new one is ready).
  # Recreate kills the old pod first, freeing the volume. Same as openclaw.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nanobot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanobot
      annotations:
        # Template bump to force the re-roll after the strategy change
        # (strategy alone does not trigger a new ReplicaSet).
        nanobot.bosscher.ch/rollout: "0.3.0-2-r1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-config
          image: ghcr.io/laurensbosscher/nanobot-canary:0.3.0-3
          command:
            - /opt/uv-tools/nanobot-ai/bin/python
            - -c
            - |
              import json
              from pathlib import Path

              config_path = Path("/home/nanobot/.nanobot/config.json")
              sample_path = Path("/etc/nanobot-sample/config.json")
              sample = json.loads(sample_path.read_text())
              config_path.parent.mkdir(parents=True, exist_ok=True)

              if not config_path.exists():
                  config_path.write_text(json.dumps(sample, indent=2) + "\n")
              else:
                  config = json.loads(config_path.read_text())
                  defaults = config.setdefault("agents", {}).setdefault("defaults", {})
                  provider = defaults.get("provider")
                  model = defaults.get("model") or ""
                  if provider in (None, "", "auto"):
                      provider = model.split("/", 1)[0] if "/" in model else None
                  provider_config = config.setdefault("providers", {}).get(provider, {})
                  api_key = provider_config.get("apiKey")
                  configured = (
                      provider == "ollama"
                      and bool(provider_config.get("apiBase"))
                  ) or (
                      isinstance(api_key, str)
                      and (bool(api_key) or api_key.startswith("${"))
                  )
                  if not configured:
                      defaults.update(sample["agents"]["defaults"])
                      ollama = config["providers"].setdefault("ollama", {})
                      ollama.setdefault("apiKey", sample["providers"]["ollama"]["apiKey"])
                      ollama["apiBase"] = sample["providers"]["ollama"]["apiBase"]
                      config_path.write_text(json.dumps(config, indent=2) + "\n")
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /home/nanobot
            - name: sample-config
              mountPath: /etc/nanobot-sample
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: nanobot
          image: ghcr.io/laurensbosscher/nanobot-canary:0.3.0-3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8765
              name: webui
          env:
            - name: HOME
              value: /home/nanobot
            - name: TZ
              value: Europe/Zurich
            # Optional WebUI password. Pod starts without it; create the
            # secret and restart to lock the UI:
            #   kubectl create secret generic nanobot-secret -n nanobot \
            #     --from-literal=NANOBOT_WEB_TOKEN='...'
            - name: NANOBOT_WEB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nanobot-secret
                  key: NANOBOT_WEB_TOKEN
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /home/nanobot
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nanobot-data
        - name: sample-config
          configMap:
            name: nanobot-config-sample
        - name: tmp
          emptyDir: {}
