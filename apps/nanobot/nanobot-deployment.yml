apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanobot
  namespace: nanobot
  labels:
    app.kubernetes.io/name: nanobot
spec:
  replicas: 1
  # RWO PVC + single replica: RollingUpdate deadlocks (new pod Pending on
  # Multi-Attach while old pod holds the volume until the new one is ready).
  # Recreate kills the old pod first, freeing the volume. Same as openclaw.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nanobot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanobot
      annotations:
        # Template bump to force the re-roll after the strategy change
        # (strategy alone does not trigger a new ReplicaSet).
        nanobot.bosscher.ch/rollout: "0.3.0-3-r2"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-config
          image: ghcr.io/laurensbosscher/nanobot-canary:0.3.0-3
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - 'mkdir -p /home/nanobot/workspace /home/nanobot/.nanobot && { [ -f /home/nanobot/.nanobot/config.json ] || cp /seed/config.json /home/nanobot/.nanobot/config.json; }'
          volumeMounts:
            - name: data
              mountPath: /home/nanobot
            - name: config-seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: nanobot
          image: ghcr.io/laurensbosscher/nanobot-canary:0.3.0-3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8765
              name: webui
          env:
            - name: HOME
              value: /home/nanobot
            - name: TZ
              value: Europe/Zurich
            # Optional WebUI password. Pod starts without it; create the
            # secret and restart to lock the UI:
            #   kubectl create secret generic nanobot-secret -n nanobot \
            #     --from-literal=NANOBOT_WEB_TOKEN='...'
            - name: NANOBOT_WEB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nanobot-secret
                  key: NANOBOT_WEB_TOKEN
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /home/nanobot
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 60
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nanobot-data
        - name: tmp
          emptyDir: {}
        - name: config-seed
          configMap:
            name: nanobot-config-seed
