apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanobot
  namespace: nanobot
  labels:
    app.kubernetes.io/name: nanobot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nanobot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanobot
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nanobot
          image: ghcr.io/laurensbosscher/nanobot-canary:0.3.0-1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8765
              name: webui
          env:
            - name: HOME
              value: /home/nanobot
            - name: TZ
              value: Europe/Zurich
            # Optional WebUI password. Pod starts without it; create the
            # secret and restart to lock the UI:
            #   kubectl create secret generic nanobot-secret -n nanobot \
            #     --from-literal=NANOBOT_WEB_TOKEN='...'
            - name: NANOBOT_WEB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nanobot-secret
                  key: NANOBOT_WEB_TOKEN
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /home/nanobot
          readinessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 60
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nanobot-data
