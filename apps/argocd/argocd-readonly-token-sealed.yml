# API token for the read-only ArgoCD account used by the homepage widget.
# Token id/expiry live in argocd-secret (accounts.readonly.tokens); this patches
# that key in, the same way argocd-github-webhook-sealed.yml patches the webhook.
# Regenerate by minting a new HS256 token with server.secretkey and sealing the
# matching {"id","iat","exp"} entry.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-readonly-token
  namespace: argocd
spec:
  encryptedData:
    accounts.readonly.tokens: 
  template:
    metadata:
      name: argocd-secret
      namespace: argocd
      annotations:
        sealedsecrets.bitnami.com/patch: "true"
    type: Opaque
