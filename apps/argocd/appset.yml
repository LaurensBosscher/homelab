apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-apps-from-folders
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/LaurensBosscher/homelab.git
        revision: main
        directories:
          - path: apps/*
  template:
    metadata:
      name: "{{path.basename}}"
      labels:
        app.kubernetes.io/part-of: homelab
    spec:
      project: default
      source:
        repoURL: https://github.com/LaurensBosscher/homelab.git
        targetRevision: main
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{path.basename}}"
      ignoreDifferences:
        # Manual/rolling restarts leave this annotation and otherwise flap OutOfSync.
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .spec.template.metadata.annotations["kubectl.kubernetes.io/restartedAt"]
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - .spec.template.metadata.annotations["kubectl.kubernetes.io/restartedAt"]
        # Chat id stays on the live ConfigMap. Do not let a sync publish it.
        - group: ""
          kind: ConfigMap
          name: argocd-notifications-cm
          jqPathExpressions:
            - .data.subscriptions
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - Prune=false
          - RespectIgnoreDifferences=true


