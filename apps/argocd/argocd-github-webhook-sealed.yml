apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  encryptedData:
    webhook.github.secret: 
    # ArgoCD API token id/expiry for the read-only account behind the
    # homepage widget. Minted as an HS256 JWT with server.secretkey.
    accounts.readonly.tokens: 
  template:
    metadata:
      name: argocd-secret
      namespace: argocd
      annotations:
        sealedsecrets.bitnami.com/patch: "true"
    type: Opaque
