apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-helm-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/LaurensBosscher/homelab.git
        revision: v2
        directories:
          - path: "helm/*"
  template:
    metadata:
      name: "{{path.basename}}"
      labels:
        app.kubernetes.io/part-of: homelab
    spec:
      project: default
      source:
        repoURL: https://github.com/LaurensBosscher/homelab.git
        targetRevision: v2
        path: "{{path}}"
        helm:
          releaseName: "{{path.basename}}"
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        # Manual until V2 restore soak completes
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
