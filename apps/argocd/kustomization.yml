apiVersion: kustomize.config.k8s.io/v1beta1

kind: Kustomization

namespace: argocd

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.0/manifests/core-install.yaml
  # UI + API Service (not in core-install). Required by CF tunnel + gatus.
  - argocd-server.yaml
  - appset.yml
  - appset-helm.yml
  - default-appproject.yml
  - argocd-notifications-cm.yml
  - argocd-notifications-secret-sealed.yml

patches:
  # Upstream core-install ships an empty notifications secret; SealedSecret owns it.
  - target:
      version: v1
      kind: Secret
      name: argocd-notifications-secret
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-notifications-secret
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: applicationsets.argoproj.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: applicationsets.argoproj.io
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
  # Public base URL for UI redirects / deep links.
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        url: https://argocd.bosscher.ch
        # Reconcile every 5 min instead of the ~3 min default loop;
        # merges still sync quickly once the GitHub webhook is configured.
        timeout.reconciliation: 300s
        timeout.hard.reconciliation: 600s
        # GitHub webhook (optional, requires sealed secret argocd-secret with
        # webhook.github.secret): uncomment after sealing.
        # See: https://argo-cd.readthedocs.io/en/stable/operator-manual/webhook/
        # webhook.github.secret: $argocd-secret:webhook.github.secret
