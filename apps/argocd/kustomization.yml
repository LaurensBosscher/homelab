apiVersion: kustomize.config.k8s.io/v1beta1

kind: Kustomization

namespace: argocd

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.0/manifests/core-install.yaml
  - appset.yml
  - appset-helm.yml
  - default-appproject.yml
  - longhorn-application.yml

patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: applicationsets.argoproj.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: applicationsets.argoproj.io
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
