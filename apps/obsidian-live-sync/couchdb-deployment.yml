apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: couchdb
    app.kubernetes.io/part-of: obsidian-live-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: couchdb
  template:
    metadata:
      labels:
        app: couchdb
        app.kubernetes.io/part-of: obsidian-live-sync
    spec:
      securityContext:
        runAsUser: 5984
        runAsGroup: 5984
        fsGroup: 5984
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - bazzite
      containers:
        - name: access-proxy
          image: python:3.13.7-alpine
          command: ["python3", "-B", "/proxy/proxy.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: COUCHDB_USER
              value: "couchdb-admin"
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-secret
                  key: COUCHDB_PASSWORD
            - name: ACCESS_EMAIL_DOMAIN
              value: laurensbosscher.nl
            - name: COUCHDB_UPSTREAM_HOST
              value: 127.0.0.1
            - name: COUCHDB_UPSTREAM_PORT
              value: "5985"
          ports:
            - name: http
              containerPort: 5984
          volumeMounts:
            - name: access-proxy
              mountPath: /proxy
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
        - name: couchdb
          image: reg.mini.dev/couchdb:v3.5.3
          # Listen on localhost only. The proxy is the pod's port 5984.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              umask 077
              {
                printf '%s\n' '[chttpd]'
                printf '%s\n' 'bind_address = 127.0.0.1'
                printf '%s\n' 'port = 5985'
                printf '%s\n' 'authentication_handlers = {chttpd_auth, cookie_authentication_handler}, {chttpd_auth, proxy_authentication_handler}, {chttpd_auth, default_authentication_handler}'
                printf '%s\n' ''
                printf '%s\n' '[chttpd_auth]'
                printf '%s\n' 'proxy_use_secret = true'
                printf 'secret = %s\n' "$COUCHDB_PASSWORD"
              } > /opt/couchdb/etc/local.d/zzz-proxy-auth.ini
              exec /docker-entrypoint.sh couchdb
          env:
            - name: COUCHDB_USER
              value: "couchdb-admin"
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-secret
                  key: COUCHDB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            - name: config
              mountPath: /opt/couchdb/etc/local.d
            - name: local-ini
              mountPath: /opt/couchdb/etc/local.ini
              subPath: local.ini
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: couchdb-data
        - name: config
          persistentVolumeClaim:
            claimName: couchdb-config
        - name: local-ini
          configMap:
            name: couchdb-config
        - name: access-proxy
          configMap:
            name: couchdb-access-proxy
