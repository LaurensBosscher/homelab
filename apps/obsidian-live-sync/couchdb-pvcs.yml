apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb-data
  labels:
    app: couchdb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb-config
  labels:
    app: couchdb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
