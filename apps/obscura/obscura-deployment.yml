apiVersion: apps/v1
kind: Deployment
metadata:
  name: obscura
  namespace: obscura
  labels:
    app.kubernetes.io/name: obscura
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obscura
  template:
    metadata:
      labels:
        app: obscura
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: obscura
          image: h4ckf0r0day/obscura:0.2.1
          args: ["serve", "--port", "9222"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 9222
              name: cdp
          env:
            - name: OBSCURA_ALLOW_PRIVATE_NETWORK
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /json/version
              port: 9222
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /json/version
              port: 9222
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
