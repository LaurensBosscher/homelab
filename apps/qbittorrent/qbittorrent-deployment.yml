apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - bazzite
      initContainers:
        # Native sidecar: owns the pod network namespace (kill-switch + VPN).
        # Privado WireGuard is custom-only in Gluetun (native privado = OpenVPN).
        - name: gluetun
          image: qmcgaw/gluetun:v3.41
          restartPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
            allowPrivilegeEscalation: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "(ip rule del table 51820; ip -6 rule del table 51820) || true"
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "custom"
            - name: VPN_TYPE
              value: "wireguard"
            - name: FIREWALL
              value: "on"
            # WebUI from cloudflared / in-cluster clients.
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            # Let qBittorrent reach cluster DNS/Services (prowlarr, etc.) off-VPN.
            # k3s defaults: pods 10.42.0.0/16, services 10.43.0.0/16.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16"
            - name: VPN_PORT_FORWARDING
              value: "off"
            - name: TZ
              value: "Europe/Zurich"
          volumeMounts:
            - name: gluetun-wg
              mountPath: /gluetun/wireguard
              readOnly: true
            - name: tun
              mountPath: /dev/net/tun
          ports:
            - containerPort: 8080
              name: webui
            - containerPort: 6881
              name: tcp-torrent
              protocol: TCP
            - containerPort: 6881
              name: udp-torrent
              protocol: UDP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.3.1
          # linuxserver/s6 must start as root then drop to PUID/PGID.
          # Do not set runAsUser here — it breaks /run permissions.
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Zurich"
            - name: WEBUI_PORT
              value: "8080"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads/
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: downloads
          hostPath:
            path: /mnt/data/downloads/
            type: DirectoryOrCreate
        # Secret key must be `wg0.conf` (Privado WireGuard ini).
        - name: gluetun-wg
          secret:
            secretName: gluetun-secrets
            items:
              - key: wg0.conf
                path: wg0.conf
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
