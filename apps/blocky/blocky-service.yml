apiVersion: v1
kind: Service
metadata:
  name: blocky
  namespace: blocky
  labels:
    app: blocky
    app.kubernetes.io/name: blocky
spec:
  type: ClusterIP
  # Pinned: CoreDNS forwards to this address. Keep in sync with
  # servers/ansible/roles/kubernetes-control-plane/templates/coredns-custom.yaml.j2
  clusterIP: 10.43.0.53
  selector:
    app: blocky
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
