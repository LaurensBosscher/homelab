# Phase 1 of the netpol rollout: default-deny ingress for blocky.
# Deny + per-source allows are separate policies so later allows never touch the deny rule.
# Allows are portless: the namespace is the trust boundary; port tightening deferred to Phase 2.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: blocky
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-dns
  namespace: blocky
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
        - ipBlock:
            cidr: 10.42.0.0/16
        - ipBlock:
            cidr: 192.168.1.0/24
        - ipBlock:
            cidr: 192.168.5.0/24
        - ipBlock:
            cidr: 192.168.1.104/32
        - ipBlock:
            cidr: 46.33.10.93/32
        - ipBlock:
            cidr: 46.33.10.90/32
        - ipBlock:
            cidr: 85.121.120.36/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
