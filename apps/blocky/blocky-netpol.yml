# Default-deny ingress for blocky.
# Deny + per-source allows are separate policies so later allows never touch the deny rule.
# The Service exposes DNS on 53 and kube-proxy DNATs to the container port.
# NetworkPolicy matches that pod port, so the allow is 1053, not 53.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: blocky
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-dns
  namespace: blocky
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
        - ipBlock:
            cidr: 10.42.0.0/16
        - ipBlock:
            cidr: 192.168.1.0/24
        - ipBlock:
            cidr: 192.168.5.0/24
        - ipBlock:
            cidr: 192.168.1.104/32
        - ipBlock:
            cidr: 46.33.10.93/32
        - ipBlock:
            cidr: 46.33.10.90/32
        - ipBlock:
            cidr: 85.121.120.36/32
      ports:
        - protocol: UDP
          port: 1053
        - protocol: TCP
          port: 1053
