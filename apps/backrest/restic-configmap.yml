apiVersion: v1
kind: ConfigMap
metadata:
  name: restic-backup-loop
  labels:
    app: restic
data:
  backup-loop.sh: |
    #!/bin/sh
    # Restic backup loop: init repo if needed, then back up all local PVC dirs daily.
    # READ-ONLY on PVC data; prune runs exclusively from Backrest.
    set -eu

    DATA_DIR=/data

    echo "[restic] checking repo..."
    restic snapshots --latest 1 >/dev/null 2>&1 || restic init

    while true; do
      echo "[restic] $(date -Is) backup round on ${RESTIC_HOSTNAME}"
      for dir in "$DATA_DIR"/*/; do
        dir="${dir%/}"
        case "$(basename "$dir")" in
          pvc-*) ;;
          *) continue ;;
        esac
        name="$(basename "$dir")"
        echo "[restic] backing up $name"
        restic backup "$dir" --tag pvc --tag "$name" \
          || echo "[restic] WARN: backup failed for $name"
      done
      # Jitter +/-30 min so nodes don't hammer B2 simultaneously
      jitter=$((($RANDOM % 3600) - 1800))
      sleep $((BACKUP_INTERVAL_SECONDS + jitter))
    done
