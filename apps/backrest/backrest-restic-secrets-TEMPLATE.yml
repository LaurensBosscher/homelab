apiVersion: v1
kind: Secret
metadata:
  name: backrest-restic-secrets
  labels:
    app: backrest
type: Opaque
# TEMPLATE ONLY — never commit plaintext values. Seal it, then replace this file
# with the resulting SealedSecret and uncomment it in kustomization.yml:
#
#   kubectl create secret generic backrest-restic-secrets \
#     --from-literal=RESTIC_PASSWORD='<long-random-passphrase>' \
#     --from-literal=AWS_ACCESS_KEY_ID='<backblaze keyID>' \
#     --from-literal=AWS_SECRET_ACCESS_KEY='<backblaze applicationKey>' \
#     -n default --dry-run=client -o yaml | \
#     kubeseal --cert sealed-secrets-public.crt -o yaml \
#     > apps/backrest/backrest-restic-secrets-sealed.yml
stringData:
  RESTIC_PASSWORD: "REPLACE_ME_SEAL_ME"
  AWS_ACCESS_KEY_ID: "REPLACE_ME_SEAL_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME_SEAL_ME"
