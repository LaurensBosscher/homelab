# The restic DaemonSet only backs up local-path PVCs. Without this job the k3s
# SQLite datastore (the cluster's entire state) and its secrets-encryption keys
# live on one disk with no off-site copy.
#
# state.db is copied with sqlite3's backup API so the snapshot is consistent
# while k3s keeps writing; db/ itself is never copied live.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k3s-control-plane-backup
  labels:
    app.kubernetes.io/name: backrest
    app.kubernetes.io/part-of: homelab
spec:
  schedule: "15 6 * * *"
  timeZone: Europe/Zurich
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backrest
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: bazzite
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: restic/restic:0.20.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  echo "[backup] $(date -Is) control-plane snapshot"
                  apk add --no-cache sqlite >/dev/null
                  sqlite3 /k3s/server/db/state.db ".backup /tmp/state.db"
                  restic snapshots --latest 1 >/dev/null 2>&1 || restic init
                  restic backup \
                    /tmp/state.db \
                    /k3s/server/token \
                    /k3s/server/cred \
                    /k3s/server/tls \
                    --host bazzite \
                    --tag control-plane
              env:
                - name: TZ
                  value: Europe/Zurich
                - name: RESTIC_REPOSITORY
                  value: "s3:https://s3.eu-central-003.backblazeb2.com/restic-k3s-backups"
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backrest-restic-secrets
                      key: RESTIC_PASSWORD
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backrest-restic-secrets
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backrest-restic-secrets
                      key: AWS_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: k3s-server
                  mountPath: /k3s/server
                  readOnly: true
          volumes:
            - name: k3s-server
              hostPath:
                path: /var/lib/rancher/k3s/server
                type: Directory
