apiVersion: v1
kind: Service
metadata:
  name: beszel
  labels:
    app: beszel
spec:
  type: ClusterIP
  # Pinned so node agents keep a stable HUB_URL. Host resolvers cannot see
  # cluster DNS, and https://beszel.bosscher.ch is behind Cloudflare Access.
  clusterIP: 10.43.103.22
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
  selector:
    app: beszel
