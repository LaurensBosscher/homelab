# Host beszel-agent on bazzite reads this ServiceAccount token. The token
# itself stays in the cluster secret and is copied onto the host out of band.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beszel-agent
  labels:
    app.kubernetes.io/name: beszel-agent
    app.kubernetes.io/part-of: homelab
---
apiVersion: v1
kind: Secret
metadata:
  name: beszel-agent-token
  annotations:
    kubernetes.io/service-account.name: beszel-agent
  labels:
    app.kubernetes.io/name: beszel-agent
    app.kubernetes.io/part-of: homelab
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: beszel-agent
  labels:
    app.kubernetes.io/name: beszel-agent
    app.kubernetes.io/part-of: homelab
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/stats", "nodes/proxy"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: beszel-agent
  labels:
    app.kubernetes.io/name: beszel-agent
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: beszel-agent
subjects:
  - kind: ServiceAccount
    name: beszel-agent
    namespace: beszel
