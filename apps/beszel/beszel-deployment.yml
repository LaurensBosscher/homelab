apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel
  labels:
    app.kubernetes.io/name: beszel
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beszel
  template:
    metadata:
      labels:
        app: beszel
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - bazzite
      containers:
      - name: beszel
        image: henrygd/beszel:0.21.1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
        - name: TZ
          value: Europe/Zurich
            # Cloudflare Access sets this header and strips client copies of it.
            # The Beszel user email must match that address. Password login stays
            # for requests without the header.
        - name: APP_URL
          value: https://beszel.bosscher.ch
        - name: TRUSTED_AUTH_HEADER
          value: Cf-Access-Authenticated-User-Email
            # Source address is the cloudflared pod, not X-Forwarded-For.
        - name: TRUSTED_PROXY_IPS
          value: 10.42.0.0/16
        ports:
        - name: http
          containerPort: 8090
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /beszel_data
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: beszel-data
