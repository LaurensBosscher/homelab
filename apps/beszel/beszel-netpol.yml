---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-monitoring
  namespace: beszel
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# Host beszel-agent units dial HUB_URL (ClusterIP) over Flannel. Source shows
# up as the node's pod/flannel CIDR (e.g. 10.42.1.0), not a namespaceSelector.
# Node WAN/LAN ipBlocks match apps/monitoring allow-ingress-cluster-nodes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-cluster-nodes
  namespace: beszel
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.0/16
        - ipBlock:
            cidr: 192.168.1.104/32
        - ipBlock:
            cidr: 46.33.10.93/32
        - ipBlock:
            cidr: 46.33.10.90/32
        - ipBlock:
            cidr: 85.121.120.36/32
