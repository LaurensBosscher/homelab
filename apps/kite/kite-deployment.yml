# Scoped dashboard role. Kite's standalone install manifest ships cluster-admin,
# but upstream explicitly calls that an evaluation default: "Review and restrict
# these permissions before using it outside a test environment."
# This role keeps read access everywhere plus the write operations a dashboard
# performs (logs, exec/terminal, scale/restart/edit/delete workloads), and
# deliberately excludes: RBAC/impersonation writes, secret & token writes,
# node writes, CRD/webhook configuration writes, namespace deletion.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: kite
    app.kubernetes.io/name: kite
  name: kite
rules:
  # Read access across all resources (dashboard browsing, incl. env display
  # and Helm release records; write access to secrets is NOT granted).
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - get
      - list
      - watch
  - nonResourceURLs:
      - /metrics
      - /version
      - /healthz
      - /readyz
      - /livez
      - /api
      - /apis
      - /openapi
      - /openapi/*
    verbs:
      - get
  # Pod operations: logs, browser terminal (exec/attach), port-forward, delete.
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/status
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods/exec
      - pods/attach
      - pods/portforward
    verbs:
      - create
  # Workload management: create/edit/scale/restart/delete.
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs:
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments/scale
      - statefulsets/scale
      - replicasets/scale
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - create
      - update
      - patch
      - delete
  # Config resources: edit services/configmaps, PVC lifecycle.
  - apiGroups:
      - ""
    resources:
      - services
      - configmaps
      - persistentvolumeclaims
    verbs:
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
  # Metrics for CPU/memory graphs.
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: kite
    app.kubernetes.io/name: kite
  name: kite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kite
subjects:
  - kind: ServiceAccount
    name: kite
    namespace: kube-system
---
kind: ServiceAccount
apiVersion: v1
metadata:
  labels:
    app: kite
    app.kubernetes.io/name: kite
  name: kite
  namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: kite
    app.kubernetes.io/name: kite
  name: kite-config
  namespace: kube-system
data:
  config.yaml: |
    superUser:
      username: "admin_kite"
      password: "${KITE_PASSWORD}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kite
    app.kubernetes.io/name: kite
  name: kite
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kite
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: kite
        app.kubernetes.io/name: kite
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - bazzite
      serviceAccountName: kite
      containers:
        - image: ghcr.io/kite-org/kite:v0.16.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          name: kite
          env:
            - name: KITE_CONFIG_FILE
              value: /etc/kite/config.yaml
            - name: DB_TYPE
              value: sqlite
            - name: DB_DSN
              value: /data/kite.db?_journal_mode=WAL&_busy_timeout=5000
            - name: KITE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kite-secrets
                  key: KITE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kite-secrets
                  key: JWT_SECRET
            - name: KITE_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: kite-secrets
                  key: KITE_ENCRYPT_KEY
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 60
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: kite-config
              mountPath: /etc/kite/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: kite-data
              mountPath: /data
      volumes:
        - name: kite-config
          configMap:
            name: kite-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: kite-data
          persistentVolumeClaim:
            claimName: kite-data
