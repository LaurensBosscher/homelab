apiVersion: v1
kind: ConfigMap
metadata:
  name: zeroclaw-config
  labels:
    app: zeroclaw
data:
  config.toml: |
    # ZeroClaw test config — minimal Telegram + OpenRouter setup.
    # Full schema: https://docs.zeroclaw.com/master/en/reference/config.html
    # Tokens come from env (ZEROCLAW_BOT_TOKEN / ZEROCLAW_LLM_API_KEY), not this file.

    # Verify exact TOML keys against docs for v0.8.5 before scaling up;
    # this file is a starting point, not a tested truth.

    [gateway]
    bind = "0.0.0.0:3210"   # ClusterIP-only exposure; pairing still required

    [channels.telegram.test]
    enabled = true
    # bot_token via env/secret at runtime

    [agent]
    model_provider = "openrouter.default"

    [providers.models.openrouter.default]
    model = "z-ai/glm-5.3-flash"
    wire_api = "chat"

    [autonomy]
    workspace_only = true
    allowed_commands = ["ls", "cat", "grep", "git"]
    forbidden_paths = ["/etc", "/root", "/proc", "/sys", "~/.ssh", "~/.gnupg", "~/.aws"]

    [secrets]
    encrypt = true
