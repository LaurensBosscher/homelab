apiVersion: v1
kind: ConfigMap
metadata:
  name: zeroclaw-config
  labels:
    app.kubernetes.io/name: zeroclaw
data:
  config.toml: |
    # Seeded onto the PVC only when config.toml is absent.
    # Tokens are env overrides, not this file:
    #   ZEROCLAW_channels__telegram__home__bot_token
    #   ZEROCLAW_providers__models__zai__default__api_key
    #   ZEROCLAW_providers__models__openrouter__default__api_key
    #   ZEROCLAW_memory__embedding_api_key
    schema_version = 3
    default_provider = "zai"
    default_model = "glm-5.3-flash"
    default_temperature = 0.7

    [gateway]
    port = 42617
    host = "[::]"
    allow_public_bind = true
    require_pairing = false
    web_dist_dir = "/usr/share/zeroclawlabs/web/dist"

    [providers.models.zai.default]
    endpoint = "global"
    model = "glm-5.3-flash"
    context_window = 1048576
    fallback = ["openrouter.default"]

    [providers.models.openrouter.default]
    model = "z-ai/glm-5.3-flash"
    context_window = 1048576

    [channels.telegram.home]
    enabled = true

    [agents.primary]
    model_provider = "zai.default"
    channels = ["telegram.home"]
    risk_profile = "yolo"
    runtime_profile = "tools"

    [browser]
    enabled = true
    backend = "agent_browser"
    native_chrome_path = "/usr/bin/brave-browser"
    allowed_domains = ["*"]

    [memory]
    backend = "sqlite"
    search_mode = "hybrid"
    embedding_provider = "openrouter"
    embedding_model = "openai/text-embedding-3-small"
    embedding_dimensions = 1536

    [runtime]
    kind = "native"
    shell = "/bin/bash"

    [runtime_profiles.tools]
    agentic = true
    max_tool_iterations = 50
    max_actions_per_hour = 120
    shell_timeout_secs = 180
    max_cost_per_day_cents = 2000

    [risk_profiles.yolo]
    level = "full"
    workspace_only = false
    allowed_commands = ["*"]
    forbidden_paths = []
    require_approval_for_medium_risk = false
    block_high_risk_commands = false
    auto_approve = ["*"]
    always_ask = []
    sandbox_enabled = false

    [risk_profiles.yolo.delegation_policy]
    mode = "allow"

    [security.otp]
    enabled = false

    [security.estop]
    enabled = false

    [security.leak_detection]
    enabled = false

    [secrets]
    encrypt = true

    [tools]
    optional = ["*"]
