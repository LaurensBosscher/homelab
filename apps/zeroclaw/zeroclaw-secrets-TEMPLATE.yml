apiVersion: v1
kind: Secret
metadata:
  name: zeroclaw-secrets
  labels:
    app.kubernetes.io/name: zeroclaw
type: Opaque
# TEMPLATE ONLY — never commit plaintext values. The live secret is
# zeroclaw-secrets-sealed.yml. To rotate:
#
# The sealed secret currently holds only the OpenRouter key. Add a dedicated
# Telegram bot (BotFather /newbot) before enabling [channels.telegram.home]:
#
#   kubectl create secret generic zeroclaw-secrets \
#     --from-literal=ZEROCLAW_channels__telegram__home__bot_token='<dedicated bot token>' \
#     --from-literal=ZEROCLAW_providers__models__openrouter__default__api_key='<openrouter key>' \
#     -n zeroclaw --dry-run=client -o yaml | \
#     kubeseal --cert sealed-secrets-public.crt -o yaml \
#     > apps/zeroclaw/zeroclaw-secrets-sealed.yml
stringData:
  ZEROCLAW_providers__models__openrouter__default__api_key: "***"
