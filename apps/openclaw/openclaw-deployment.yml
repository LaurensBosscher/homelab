apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-gateway
  labels:
    app.kubernetes.io/name: openclaw
    component: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
      component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
        component: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: city
                    operator: In
                    values:
                      - zurich
      containers:
        - name: gateway
          image: ghcr.io/laurensbosscher/openclaw-tools:2026.8.1-2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              # Self-heal config/state/plugin drift before the gateway boots.
              # Runs on every (re)start so upgrade breakage auto-repairs.
              # Doctor is best-effort: a failure must not brick the gateway.
              openclaw doctor --yes --fix || echo "openclaw doctor --fix failed (non-fatal), starting gateway anyway"
              openclaw plugins enable acpx --accept-capabilities || echo "acpx consent failed (non-fatal)"
              openclaw update repair || echo "update repair failed (non-fatal)"
              # Seed Brave ad-block filter lists for the managed browser profile
              brave-preferences.sh || echo "brave-preferences failed (non-fatal)"
              exec openclaw gateway --bind lan --port 18789 --allow-unconfigured
          ports:
            - containerPort: 18789
            - containerPort: 18790
          env:
            - name: HOME
              value: /home/node
            - name: TERM
              value: xterm-256color
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secret
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: ZAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secret
                  key: ZAI_API_KEY
            - name: TZ
              value: Europe/Zurich
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /home/node/
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 6Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18789
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 18789
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 5
        - name: opencode
          image: ghcr.io/laurensbosscher/openclaw-tools:2026.8.1-2
          imagePullPolicy: IfNotPresent
          command:
            - opencode
            - web
            - --port
            - "4096"
            - --hostname
            - 0.0.0.0
          ports:
            - name: opencode-http
              containerPort: 4096
              protocol: TCP
          env:
            - name: HOME
              value: /home/node
            - name: TZ
              value: Europe/Zurich
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /home/node/
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /global/health
              port: 4096
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /global/health
              port: 4096
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 5
        - name: debug-tools
          image: alpine:3.24.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - apk add --no-cache nano bash curl wget bind-tools iputils busybox-extras net-tools procps && sleep infinity
          env:
            - name: TERM
              value: xterm-256color
            - name: TZ
              value: Europe/Zurich
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /home/node/
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-pvc
        - name: tmp
          emptyDir: {}
