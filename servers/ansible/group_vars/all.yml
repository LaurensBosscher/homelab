---
# Global variables
apply_security_updates: true
configure_tailscale: true
kubecolor_install: true
zram_enable: true

ansible_ssh_private_key_file: ~/.ssh/id_rsa_kubernetes
ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"

# CrowdSec collections
crowdsec_collections:
  - crowdsecurity/iptables
  - crowdsecurity/kubernetes
  - crowdsecurity/linux
  - crowdsecurity/ssh

# Firewall configuration
firewall_enable: true

# Public clients allowed to bootstrap/join K3s over the WAN API endpoint and
# use SSH as a fallback when Tailscale is unavailable.
firewall_k3s_api_extra_allowed_ips:
  - 84.226.17.204

# Metrics-server runs as a pod and must reach every node's kubelet API.
# Kubelet authentication and authorization still protect the endpoint.
firewall_kubelet_allowed_pod_cidrs:
  - 10.42.0.0/16

# Extra WAN peers for cluster members that are not Ansible-managed (e.g. bazzite/home).
# Included in Flannel WireGuard + node allowlists.
firewall_extra_peer_ips:
  - 84.226.17.204

# Beszel agent (hub runs in-cluster in the beszel namespace).
# Public key is the hub's ed25519 key — extracted from the hub pod on first deploy.
beszel_agent_version: "0.19.0"
beszel_agent_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKfQjDttAcHBpgByCelV9GtjGj5fbbqPbCshWTR0fff2"

# Tool versions
k9s_version: "v0.51.0"
k3s_version: "v1.36.2+k3s1"

# System tuning
tailscale_mtu: 1280
journal_max_use: "2G"
journal_runtime_max_use: "512M"
journal_max_retention: "1month"
journal_max_file_sec: "1week"

# ELRepo
elrepo_rpm_url: "https://www.elrepo.org/elrepo-release-10.el10.elrepo.noarch.rpm"

# Chrony: allow Tailscale peers to use this node as NTP when public UDP/123
# is blocked (seen on Pandahost California VPSes). Skipped automatically on
# client-only chrony builds that lack +NTP.
chrony_allow_cidrs:
  - 100.64.0.0/10
# Fallback NTP servers over Tailscale (london control-plane / workers with public NTP).
chrony_extra_servers:
  - 100.79.162.75
  - 100.106.134.105
