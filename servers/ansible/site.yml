---
- name: Apply shared roles to all nodes
  hosts: all
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  pre_tasks:
    - name: Update dnf cache
      ansible.builtin.dnf:
        update_cache: yes
      tags: [always]

    # V2: Tailscale is SSH/admin only. Never bind Flannel to tailscale0
    # (nested WG-in-WG floods the API path). Prefer physical NICs.
    - name: Build cluster network interface candidates
      ansible.builtin.set_fact:
        # Prefer known physical NICs; never fall through to tailscale0/flannel/cni.
        _cluster_iface_candidates: >-
          {{
            (['eth0', 'ens3', 'ens192', 'enp2s0', 'enp1s0']
              | select('in', ansible_facts.interfaces)
              | list)
            + (
              [ansible_facts.default_ipv4.interface]
              if ansible_facts.default_ipv4.interface not in ['tailscale0', 'lo']
              else []
            )
            + (
              ansible_facts.interfaces
              | reject('equalto', 'lo')
              | reject('equalto', 'tailscale0')
              | reject('match', '^(flannel|cni|veth|wg|docker|br-)')
              | list
            )
          }}
      tags: [always]

    - name: Select cluster network interface
      ansible.builtin.set_fact:
        cluster_network_interface: "{{ (_cluster_iface_candidates | unique | list)[0] }}"
      tags: [always]

    - name: Set network interface IPs
      ansible.builtin.set_fact:
        tailscale_ip: "{{ ansible_facts.get('tailscale0', {}).get('ipv4', {}).get('address', ansible_facts.default_ipv4.address) }}"
        cluster_network_ip: "{{ ansible_facts.get(cluster_network_interface, {}).get('ipv4', {}).get('address', ansible_facts.default_ipv4.address) }}"
      tags: [always]

    - name: Set public WAN IP for Flannel peers
      ansible.builtin.set_fact:
        # Public IP peers use for Flannel WireGuard (UDP/51820). Required for NAT/home nodes.
        cluster_external_ip: "{{ cluster_wan_ip | default(cluster_network_ip) }}"
      tags: [always]

    - name: Refuse Tailscale as Flannel interface
      ansible.builtin.assert:
        that:
          - cluster_network_interface != 'tailscale0'
          - not (cluster_network_interface is match('^(flannel|cni|veth|wg)'))
        fail_msg: >-
          Refusing to bind Flannel to {{ cluster_network_interface }}.
          Set a physical NIC (or inventory override); Tailscale is admin-only.
      tags: [always]

  roles:
    - { role: security_updates }
    - { role: system-hardening }
    - { role: dotfiles }
    - { role: tools }
    - { role: iscsid }
    - { role: k9s }
    - { role: optimizations }
    - { role: network-optimizations }
    - { role: tailscale }
    - { role: kubecolor }
    - { role: zram }
    - { role: ssh }
    - { role: crowdsec }
    - { role: k3s-oom-protection }
    - { role: k3s-install }
    - { role: beszel-agent }
    - { role: firewall }

- name: Kubernetes control plane configuration
  hosts: kubernetes_control_plane
  serial: 1
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  roles:
    - { role: k3s-common }
    - { role: kubernetes-control-plane }
    - { role: k3s-cert-renewal }
    - { role: etcd-io-priority }
    - { role: etcd-maintenance }

- name: Kubernetes agent node configuration
  hosts: kubernetes_agent
  serial: 1
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  roles:
    - { role: k3s-common }
    - { role: kubernetes-agent }
  tasks:
    - name: Remove k3s certificate renewal from agent nodes
      ansible.builtin.include_role:
        name: k3s-cert-renewal
        tasks_from: remove


- name: Enable Tailscale SSH and automatic client updates
  hosts: all
  serial: 1
  become: true
  gather_facts: false
  tasks:
    - name: Read Tailscale preferences before enabling SSH
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_preferences
      changed_when: false
      tags: [tailscale, tailscale_ssh, updates]

    # Keep this as the final play: enabling Tailscale SSH can interrupt the
    # current SSH connection to the node's Tailscale IP.
    - name: Enable Tailscale SSH and automatic updates
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - --ssh
          - --auto-update
          - --accept-risk=lose-ssh
      when: >-
        tailscale_preferences.stdout is not search('"RunSSH": true')
        or tailscale_preferences.stdout is not search('"Apply": true')
      # Do not wait on the SSH channel after Tailscale takes over port 22.
      async: 30
      poll: 0
      tags: [tailscale, tailscale_ssh, updates]