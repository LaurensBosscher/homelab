---
- name: Check if Tailscale is already installed
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: tailscale_binary
  tags: [tailscale]

- name: Download Tailscale install script
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/tailscale-install.sh
    mode: "0755"
  when: not tailscale_binary.stat.exists
  become: true
  tags: [tailscale]

- name: Install Tailscale
  ansible.builtin.command: /tmp/tailscale-install.sh
  when: not tailscale_binary.stat.exists
  become: true
  register: tailscale_install
  tags: [tailscale]

- name: Clean up install script
  ansible.builtin.file:
    path: /tmp/tailscale-install.sh
    state: absent
  when: not tailscale_binary.stat.exists
  tags: [tailscale]

- name: Enable and start Tailscale service
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
  tags: [tailscale]

- name: Read Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_preferences
  changed_when: false
  failed_when: false
  tags: [tailscale]

- name: Disable accepted subnet routes
  ansible.builtin.command: tailscale set --accept-routes=false
  when:
    - tailscale_preferences.rc == 0
    - >-
      tailscale_preferences.stdout is search('"RouteAll": true')
  become: true
  tags: [tailscale]

# 1200 avoids TLS ClientHello blackholes when Tailscale rides WG/Flannel-adjacent paths.
- name: Create udev rule for Tailscale MTU
  ansible.builtin.copy:
    content: |
      ACTION=="add", SUBSYSTEM=="net", KERNEL=="tailscale0", RUN+="/sbin/ip link set dev tailscale0 mtu {{ tailscale_mtu | default(1200) }}"
    dest: /etc/udev/rules.d/99-tailscale-mtu.rules
    mode: "0644"
  become: true
  tags: [tailscale]

# V2: Flannel is on public WAN; Tailscale is admin/API only. If Tailscale
# discovers flannel-wg/cni0 as "direct" endpoints, agent→API TLS breaks.
- name: Install script to keep Tailscale off Flannel/CNI
  ansible.builtin.copy:
    dest: /usr/local/sbin/block-tailscale-on-flannel.sh
    mode: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      for iface in flannel-wg flannel.1 cni0; do
        iptables -C INPUT -i "$iface" -p udp --dport 41641 -j DROP 2>/dev/null \
          || iptables -I INPUT -i "$iface" -p udp --dport 41641 -j DROP
        iptables -C OUTPUT -o "$iface" -p udp --dport 41641 -j DROP 2>/dev/null \
          || iptables -I OUTPUT -o "$iface" -p udp --dport 41641 -j DROP
        iptables -C OUTPUT -o "$iface" -p udp --sport 41641 -j DROP 2>/dev/null \
          || iptables -I OUTPUT -o "$iface" -p udp --sport 41641 -j DROP
      done
  become: true
  tags: [tailscale, flannel]

- name: Install overlay MSS clamp script
  ansible.builtin.copy:
    dest: /usr/local/sbin/fix-overlay-mss.sh
    mode: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      ip link set dev tailscale0 mtu {{ tailscale_mtu | default(1200) }} 2>/dev/null || true
      for iface in tailscale0 flannel-wg; do
        iptables -t mangle -C POSTROUTING -o "$iface" -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1100 2>/dev/null \
          || iptables -t mangle -I POSTROUTING -o "$iface" -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1100
        iptables -t mangle -C PREROUTING -i "$iface" -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1100 2>/dev/null \
          || iptables -t mangle -I PREROUTING -i "$iface" -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1100
      done
  become: true
  tags: [tailscale, flannel]

- name: Install oneshot unit for Tailscale/Flannel separation
  ansible.builtin.copy:
    dest: /etc/systemd/system/block-tailscale-on-flannel.service
    mode: "0644"
    content: |
      [Unit]
      Description=Block Tailscale on Flannel + clamp overlay MSS
      After=network-online.target tailscaled.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/block-tailscale-on-flannel.sh
      ExecStart=/usr/local/sbin/fix-overlay-mss.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  become: true
  tags: [tailscale, flannel]

- name: Enable Tailscale/Flannel separation oneshot
  ansible.builtin.systemd:
    name: block-tailscale-on-flannel
    enabled: true
    state: started
    daemon_reload: true
  become: true
  tags: [tailscale, flannel]

- name: Enable TCP MTU probing
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tcp-mtu-probing.conf
    mode: "0644"
    content: |
      net.ipv4.tcp_mtu_probing=1
      net.ipv4.tcp_mtu_probe_floor=1024
  become: true
  tags: [tailscale, flannel]

- name: Apply TCP MTU probing sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-tcp-mtu-probing.conf
  become: true
  tags: [tailscale, flannel]

- name: Check if udev rules need reloading
  ansible.builtin.stat:
    path: /etc/udev/rules.d/99-tailscale-mtu.rules
  register: tailscale_udev_rule
  tags: [tailscale]

- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload-rules
  become: true
  when: tailscale_udev_rule.stat.exists
  tags: [tailscale]

- name: Trigger udev rules for network subsystem
  ansible.builtin.command: udevadm trigger --subsystem-match=net --action=add
  become: true
  when: tailscale_udev_rule.stat.exists
  tags: [tailscale]

- name: Enable IP forwarding for Tailscale
  ansible.builtin.lineinfile:
    path: /etc/sysctl.d/99-tailscale.conf
    line: "{{ item }}"
    create: true
    mode: "0644"
  become: true
  loop:
    - "net.ipv4.ip_forward = 1"
    - "net.ipv6.conf.all.forwarding = 1"
  tags: [tailscale]

- name: Apply sysctl configuration
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-tailscale.conf
  become: true
  tags: [tailscale]
