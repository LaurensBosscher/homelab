---
s1screen_enabled: false
s1screen_src: "{{ playbook_dir }}/../s1screen"
s1screen_dest: /var/lib/s1screen
s1screen_orientation: landscape
s1screen_refresh: 5
s1screen_net_iface: enp2s0
s1screen_disk_path: /var
s1screen_disk_label: VAR
s1screen_active_enabled: true
s1screen_active_start: "18:00"
s1screen_active_end: "00:00"
s1screen_active_weekend_start: "08:00"
s1screen_active_weekend_end: "00:00"
s1screen_kubeconfig: /etc/rancher/k3s/k3s.yaml
s1screen_led_enabled: true
s1screen_led_meter: max
s1screen_led_port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:7:1.0-port0
