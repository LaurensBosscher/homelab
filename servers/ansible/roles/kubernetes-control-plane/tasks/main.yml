---
- name: Ensure /etc/rancher/k3s directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Create /etc/rancher/k3s/config.yaml with built-in Tailscale configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  notify: restart k3s
  tags: [k3s, control-plane]

# V1 leftover: this drop-in pointed the single SQLite server at a retired
# k3s-amsterdam/Tailscale peer as a joining server. k3s hides its own argv, so
# the running process looked fine while the unit file would re-join on restart.
- name: Remove the V1 k3s systemd override
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d/override.conf
    state: absent
  notify: restart k3s
  tags: [k3s, control-plane]

- name: Persist CoreDNS placement for cross-region DNS availability
  ansible.builtin.template:
    src: coredns-config.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/coredns-config.yaml
    mode: "0644"

- name: Forward external CoreDNS queries through the Blocky blocklist
  ansible.builtin.template:
    src: coredns-custom.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/coredns-custom.yaml
    mode: "0644"
