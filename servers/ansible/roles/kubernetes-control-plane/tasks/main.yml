---
- name: Ensure /etc/rancher/k3s directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Create /etc/rancher/k3s/config.yaml with built-in Tailscale configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  notify: restart k3s

- name: Persist CoreDNS placement for cross-region DNS availability
  ansible.builtin.template:
    src: coredns-config.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/coredns-config.yaml
    mode: "0644"

- name: Forward external CoreDNS queries through the Blocky blocklist
  ansible.builtin.template:
    src: coredns-custom.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/coredns-custom.yaml
    mode: "0644"


