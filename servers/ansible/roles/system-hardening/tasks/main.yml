---
- name: Configure journald log rotation and limits
  ansible.builtin.blockinfile:
    path: /etc/systemd/journald.conf
    block: |
      SystemMaxUse={{ journal_max_use | default('2G') }}
      RuntimeMaxUse={{ journal_runtime_max_use | default('512M') }}
      MaxRetentionSec={{ journal_max_retention | default('1month') }}
      MaxFileSec={{ journal_max_file_sec | default('1week') }}
    marker: "# {mark} ANSIBLE MANAGED BLOCK - journald limits"
    backup: yes
    create: yes
  notify: restart journald
  tags: [system-hardening, logging]

- name: Install NTP client (chrony)
  ansible.builtin.dnf:
    name: chrony
    state: present
  tags: [system-hardening, time-sync]

- name: Detect whether chronyd was built with NTP server support
  ansible.builtin.command: chronyd -v
  register: chronyd_version
  changed_when: false
  failed_when: false
  tags: [system-hardening, time-sync]

- name: Configure chronyd
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    mode: "0644"
    backup: true
  vars:
    # Client-only chrony builds (no +NTP) reject `allow` directives.
    chrony_allow_cidrs: >-
      {{
        (chrony_allow_cidrs | default([]))
        if ('+NTP' in (chronyd_version.stdout | default('')))
        else []
      }}
  notify: restart chronyd
  tags: [system-hardening, time-sync]

- name: Prefer RTC kept in UTC
  ansible.builtin.command: timedatectl set-local-rtc 0
  register: timedatectl_local_rtc
  changed_when: false
  failed_when: false
  tags: [system-hardening, time-sync]

- name: Enable and start chronyd service
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true
  tags: [system-hardening, time-sync]

- name: Install CPU power management tools
  ansible.builtin.dnf:
    name: kernel-tools
    state: present
  tags: [system-hardening, cpu-optimization]

- name: Set CPU governor to performance
  ansible.builtin.shell: |
    for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
      echo performance > $cpu 2>/dev/null || true
    done
  become: true
  changed_when: false
  tags: [system-hardening, cpu-optimization]

- name: Create systemd service for CPU governor persistence
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Set CPU governor to performance
      After=multi-user.target

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c 'for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do echo performance > $cpu 2>/dev/null || true; done'
      RemainAfterExit=true

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/cpu-governor-performance.service
    mode: "0644"
  become: true
  tags: [system-hardening, cpu-optimization]

- name: Enable CPU governor service
  ansible.builtin.systemd:
    name: cpu-governor-performance
    enabled: true
    daemon_reload: true
  become: true
  tags: [system-hardening, cpu-optimization]

- name: Install SELinux packages
  ansible.builtin.dnf:
    name:
      - selinux-policy
      - selinux-policy-targeted
      - policycoreutils
      - policycoreutils-python-utils
    state: present
  when: k3s_selinux_enabled | default(true) | bool
  tags: [system-hardening, selinux]

- name: Ensure SELinux is set to enforcing mode
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=enforcing'
    state: present
    backup: yes
  when: k3s_selinux_enabled | default(true) | bool
  tags: [system-hardening, selinux]

- name: Ensure SELinux policy type is targeted
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUXTYPE='
    line: 'SELINUXTYPE=targeted'
    state: present
  when: k3s_selinux_enabled | default(true) | bool
  tags: [system-hardening, selinux]

# VPS nodes have no serial console wired up. Left alone, agetty respawns every
# few seconds and writes "failed to get terminal attributes" to the journal.
- name: Disable console getty units on headless nodes
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  loop: "{{ console_getty_units }}"
  when: console_getty_headless | bool
  tags: [system-hardening, console]

# Bazzite (and similar) can autologin a GNOME seat that is unused for ops but
# still accumulates compositor shared memory until the box is memory-starved.
- name: Check for GDM custom.conf when managing autologin
  ansible.builtin.stat:
    path: "{{ gdm_custom_conf }}"
  register: gdm_custom_conf_stat
  when: gdm_manage_autologin | bool
  tags: [system-hardening, gdm]

- name: Disable GDM automatic login
  ansible.builtin.lineinfile:
    path: "{{ gdm_custom_conf }}"
    regexp: '^#?\s*AutomaticLoginEnable='
    line: 'AutomaticLoginEnable=False'
    insertafter: '^\[daemon\]'
  when:
    - gdm_manage_autologin | bool
    - gdm_custom_conf_stat.stat.exists | default(false)
  tags: [system-hardening, gdm]

- name: Disable GDM service when managing autologin
  ansible.builtin.systemd:
    name: gdm.service
    enabled: false
    state: stopped
  when:
    - gdm_manage_autologin | bool
    - gdm_custom_conf_stat.stat.exists | default(false)
  failed_when: false
  tags: [system-hardening, gdm]

# Full desktop off: SDDM (Bazzite deck) still autologins via steamos.conf even
# when GDM is disabled. multi-user.target keeps s1screen and k3s.
- name: Neutralize SDDM autologin for server mode
  ansible.builtin.copy:
    dest: "{{ desktop_sddm_override }}"
    mode: "0644"
    content: |
      # Ansible managed — server mode (desktop_disable).
      # Overrides /etc/sddm.conf.d/steamos.conf Relogin/User/Session.
      [Autologin]
      Relogin=false
      User=
      Session=
  when: desktop_disable | bool
  tags: [system-hardening, desktop]

- name: Stop and disable display-manager stack for server mode
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  loop: "{{ desktop_disable_services }}"
  when: desktop_disable | bool
  failed_when: false
  tags: [system-hardening, desktop]

- name: Read current default systemd target
  ansible.builtin.command:
    argv: ["systemctl", "get-default"]
  register: desktop_current_default
  changed_when: false
  when: desktop_disable | bool
  tags: [system-hardening, desktop]

- name: Set default target to multi-user when desktop disabled
  ansible.builtin.command:
    argv: ["systemctl", "set-default", "multi-user.target"]
  when:
    - desktop_disable | bool
    - (desktop_current_default.stdout | default('')) != 'multi-user.target'
  tags: [system-hardening, desktop]

- name: Blacklist GPU DRM modules when unused
  ansible.builtin.copy:
    dest: "{{ gpu_modprobe_conf }}"
    mode: "0644"
    content: |
      # Ansible managed — gpu_disable. s1screen uses USB serial, not DRM.
      {% for mod in gpu_blacklist_modules %}
      blacklist {{ mod }}
      install {{ mod }} /bin/false
      {% endfor %}
  when: gpu_disable | bool
  tags: [system-hardening, gpu]

- name: Unbind and unload GPU modules now if idle
  ansible.builtin.shell: |
    set -e
    # Drop driver from PCI devices first; rmmod alone often fails while bound.
    for drv in {{ gpu_blacklist_modules | join(' ') }}; do
      sys="/sys/bus/pci/drivers/$drv"
      if [ -d "$sys" ]; then
        for link in "$sys"/0000:*; do
          [ -e "$link" ] || continue
          bdf=$(basename "$link")
          echo "$bdf" > "$sys/unbind" 2>/dev/null || true
        done
      fi
    done
    for mod in {{ gpu_blacklist_modules | join(' ') }}; do
      if lsmod | awk '{print $1}' | grep -qx "$mod"; then
        modprobe -r "$mod" 2>/dev/null || rmmod "$mod" 2>/dev/null || true
      fi
    done
    for mod in drm_ttm_helper drm_exec drm_gpuvm drm_suballoc_helper gpu_sched amdxcp drm_panel_backlight_quirks; do
      modprobe -r "$mod" 2>/dev/null || true
    done
    exit 0
  args:
    executable: /bin/bash
  when: gpu_disable | bool
  changed_when: false
  tags: [system-hardening, gpu]
