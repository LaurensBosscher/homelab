---
# Chrony defaults. Override per-host/group when public NTP is blocked.
chrony_pool: "2.almalinux.pool.ntp.org"
# Extra NTP servers (used as fallback / primary when pool is unreachable).
chrony_extra_servers: []
# CIDRs allowed to query this node as an NTP server (requires chrony +NTP build).
chrony_allow_cidrs: []
# Headless nodes have no console attached: getty units then loop on
# "failed to get terminal attributes" and flood the journal. Enable per group.
console_getty_headless: false
console_getty_units:
  - serial-getty@ttyS0.service
# Opt-in: disable GDM autologin on hosts that run a graphical seat but should
# not keep an idle GNOME/Wayland session (seen: ~22GiB compositor Shmem on bazzite).
gdm_manage_autologin: false
gdm_custom_conf: /etc/gdm/custom.conf
