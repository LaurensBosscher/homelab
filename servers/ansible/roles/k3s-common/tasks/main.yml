---
- name: Ensure /etc/rancher/k3s directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Configure kubelet to use limited swap and resource constraints
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/kubelet-config.yaml
    content: |
      kind: KubeletConfiguration
      apiVersion: kubelet.config.k8s.io/v1beta1

      failSwapOn: false
      memorySwap:
        swapBehavior: LimitedSwap
      systemReserved:
        cpu: 100m
        memory: 256Mi
      kubeReserved:
        cpu: 100m
        memory: 256Mi

      containerLogMaxSize: 10Mi
      containerLogMaxFiles: 2

      imageGCHighThresholdPercent: 85
      imageGCLowThresholdPercent: 80
      imageMaximumGCAge: "24h"

      nodeStatusUpdateFrequency: 10s
      maxPods: 200

      # Enable NodeSwap for controlled swap usage (Beta in 1.34+)
      featureGates:
        NodeSwap: true

      # Enable SeccompDefault for enhanced container security
      seccompDefault: true
    owner: root
    group: root
    mode: "0644"
  notify:
    - restart k3s
    - restart k3s-agent

- name: Upgrade K3s to specified version
  when: k3s_version is defined
  block:
    - name: Check current K3s version
      ansible.builtin.command: k3s --version
      register: k3s_current_version
      changed_when: false
      failed_when: false

    - name: Download K3s binary
      ansible.builtin.get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
        dest: /tmp/k3s-{{ k3s_version }}
        mode: "0755"
        checksum: "sha256:https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/sha256sum-amd64.txt"
      when: k3s_version not in k3s_current_version.stdout | default('')

    - name: Stop K3s service before upgrade
      ansible.builtin.systemd:
        name: "{{ 'k3s' if inventory_hostname in groups['kubernetes_control_plane'] else 'k3s-agent' }}"
        state: stopped
      when: k3s_version not in k3s_current_version.stdout | default('')

    - name: Install new K3s binary
      ansible.builtin.copy:
        src: /tmp/k3s-{{ k3s_version }}
        dest: /usr/local/bin/k3s
        mode: "0755"
        owner: root
        group: root
        remote_src: true
      when: k3s_version not in k3s_current_version.stdout | default('')
      notify:
        - restart k3s
        - restart k3s-agent

    - name: Restore SELinux label on K3s binary after upgrade
      ansible.builtin.command: restorecon -v /usr/local/bin/k3s
      when:
        - k3s_selinux_enabled | default(true) | bool
        - k3s_version not in k3s_current_version.stdout | default('')
      changed_when: "'Relabeled' in restorecon_k3s.stdout | default('')"
      register: restorecon_k3s
      failed_when: false

    - name: Remove temporary K3s binary
      ansible.builtin.file:
        path: /tmp/k3s-{{ k3s_version }}
        state: absent
      when: k3s_version not in k3s_current_version.stdout | default('')

    - name: Verify K3s version after upgrade
      ansible.builtin.command: k3s --version
      register: k3s_new_version
      changed_when: false
      failed_when: k3s_version not in k3s_new_version.stdout

- name: Ensure k3s-selinux package is installed
  ansible.builtin.package:
    name: k3s-selinux
    state: present
  when: k3s_selinux_enabled | default(true) | bool
  failed_when: false
  tags: [k3s, selinux]

- name: Enable container_manage_cgroup SELinux boolean
  ansible.builtin.command: setsebool -P container_manage_cgroup 1
  when: k3s_selinux_enabled | default(true) | bool
  changed_when: false
  failed_when: false
  tags: [k3s, selinux]

- name: Ensure SELinux fcontext for custom local-path storage
  ansible.builtin.command: >
    semanage fcontext -a -t container_file_t {{ k3s_local_path_fcontext | quote }}
  when:
    - k3s_selinux_enabled | default(true) | bool
    - k3s_local_path_fcontext is defined
  register: k3s_local_path_fcontext_add
  failed_when: false
  changed_when: k3s_local_path_fcontext_add.rc == 0
  tags: [k3s, selinux]

- name: Modify SELinux fcontext for custom local-path storage if already present
  ansible.builtin.command: >
    semanage fcontext -m -t container_file_t {{ k3s_local_path_fcontext | quote }}
  when:
    - k3s_selinux_enabled | default(true) | bool
    - k3s_local_path_fcontext is defined
    - k3s_local_path_fcontext_add.rc | default(0) != 0
  register: k3s_local_path_fcontext_mod
  failed_when: false
  changed_when: k3s_local_path_fcontext_mod.rc == 0
  tags: [k3s, selinux]

- name: Ensure SELinux fcontext for /etc/rancher
  ansible.builtin.command: semanage fcontext -a -t container_config_t "/etc/rancher(/.*)?"
  when: k3s_selinux_enabled | default(true) | bool
  register: k3s_etc_fcontext_add
  failed_when: false
  changed_when: k3s_etc_fcontext_add.rc == 0
  tags: [k3s, selinux]

# Local overrides like /usr/local/bin/k3s → bin_t can beat the packaged
# /usr/local/s?bin/k3s → container_runtime_exec_t rule (seen on Alma agents).
- name: Ensure SELinux fcontext for /usr/local/bin/k3s
  ansible.builtin.command: semanage fcontext -a -t container_runtime_exec_t "/usr/local/bin/k3s"
  when: k3s_selinux_enabled | default(true) | bool
  register: k3s_bin_fcontext_add
  failed_when: false
  changed_when: k3s_bin_fcontext_add.rc == 0
  tags: [k3s, selinux]

- name: Modify SELinux fcontext for /usr/local/bin/k3s if already present
  ansible.builtin.command: semanage fcontext -m -t container_runtime_exec_t "/usr/local/bin/k3s"
  when:
    - k3s_selinux_enabled | default(true) | bool
    - k3s_bin_fcontext_add.rc | default(0) != 0
  register: k3s_bin_fcontext_mod
  failed_when: false
  changed_when: k3s_bin_fcontext_mod.rc == 0
  tags: [k3s, selinux]

# k3s-selinux ships /var/run/k3s → container_var_run_t, but on modern systems
# /var/run ≡ /run and matchpathcon resolves /run/k3s to var_run_t unless explicit.
- name: Ensure SELinux fcontext for /run/k3s
  ansible.builtin.command: semanage fcontext -a -t container_var_run_t "/run/k3s(/.*)?"
  when: k3s_selinux_enabled | default(true) | bool
  register: k3s_run_fcontext_add
  failed_when: false
  changed_when: k3s_run_fcontext_add.rc == 0
  tags: [k3s, selinux]

- name: Modify SELinux fcontext for /run/k3s if already present
  ansible.builtin.command: semanage fcontext -m -t container_var_run_t "/run/k3s(/.*)?"
  when:
    - k3s_selinux_enabled | default(true) | bool
    - k3s_run_fcontext_add.rc | default(0) != 0
  register: k3s_run_fcontext_mod
  failed_when: false
  changed_when: k3s_run_fcontext_mod.rc == 0
  tags: [k3s, selinux]

# Restic's DaemonSet hostPath is /var/lib/rancher/k3s/storage (type Directory),
# so the path has to exist before the pod can start. London uses that directory
# as its local-path root. Bazzite's PVCs live on the data disk, so the k3s path
# becomes a symlink and the cluster-wide DaemonSet sees them too.
- name: Ensure local-path storage directory exists
  ansible.builtin.file:
    path: "{{ k3s_local_path_storage }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k3s, local-path]

# One step: a gap between rmdir and ln lets kubelet recreate the empty
# directory, and the file module then refuses to replace it.
- name: Point the restic hostPath at the local-path root
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        dest=/var/lib/rancher/k3s/storage
        src=$1
        if [ -L "$dest" ] && [ "$(readlink "$dest")" = "$src" ]; then
          echo unchanged
          exit 0
        fi
        if [ -e "$dest" ] && [ ! -L "$dest" ]; then
          if [ ! -d "$dest" ] || [ -n "$(ls -A "$dest")" ]; then
            echo "$dest is not an empty directory, refusing to replace it with a symlink to $src" >&2
            exit 1
          fi
          rmdir "$dest"
        fi
        ln -sfn "$src" "$dest"
        echo changed
      - _
      - "{{ k3s_local_path_storage }}"
  register: k3s_storage_link
  changed_when: k3s_storage_link.stdout | trim == 'changed'
  when: k3s_local_path_storage != '/var/lib/rancher/k3s/storage'
  tags: [k3s, local-path]

- name: Restore SELinux labels on k3s paths
  ansible.builtin.command: >
    restorecon -Rv
    /usr/local/bin/k3s
    /etc/rancher
    /run/k3s
    /var/run/k3s
    /var/lib/kubelet
    /var/lib/rancher/k3s
    {% if k3s_local_path_storage is defined %}{{ k3s_local_path_storage }}{% endif %}
  when: k3s_selinux_enabled | default(true) | bool
  register: k3s_restorecon
  changed_when: "'Relabeled' in k3s_restorecon.stdout | default('')"
  failed_when: false
  tags: [k3s, selinux]
