---
- name: Configure host firewall (nftables)
  when: firewall_enable | bool
  tags: [firewall]
  block:
    - name: Stop and disable firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Mask firewalld to prevent accidental start
      ansible.builtin.systemd:
        name: firewalld
        masked: true
      ignore_errors: true

    # ansible_host is Tailscale (100.x) for SSH — do not treat it as a WAN peer.
    # WAN identity comes from fact-derived cluster_network_ip and/or inventory cluster_wan_ip.
    - name: Build dynamic allowlists from inventory
      vars:
        firewall_node_hosts: "{{ (groups['kubernetes_control_plane'] | default([])) + (groups['kubernetes_agent'] | default([])) }}"
        firewall_control_plane_hosts: "{{ groups['kubernetes_control_plane'] | default([]) }}"
      ansible.builtin.set_fact:
        firewall_cluster_network_ips: >-
          {{ (
               (firewall_node_hosts | map('extract', hostvars, 'cluster_network_ip') | select('defined') | list)
               + (firewall_node_hosts | map('extract', hostvars, 'cluster_wan_ip') | select('defined') | list)
               + (firewall_extra_peer_ips | default([]))
             )
             | unique
             | list }}
        # Flannel WireGuard peers must allow the IP other nodes observe on the wire.
        # For public VPS nodes this matches cluster_network_ip/cluster_wan_ip.
        # For NAT/home nodes set cluster_wan_ip / firewall_extra_peer_ips to the public IP.
        firewall_flannel_peer_ips: >-
          {{ (
               (firewall_node_hosts | map('extract', hostvars, 'cluster_network_ip') | select('defined') | list)
               + (firewall_node_hosts | map('extract', hostvars, 'cluster_wan_ip') | select('defined') | list)
               + (firewall_extra_peer_ips | default([]))
             )
             | unique
             | list }}
        firewall_k3s_api_allowed_ips: >-
          {{ (
               (firewall_node_hosts | map('extract', hostvars, 'cluster_network_ip') | select('defined') | list)
               + (firewall_node_hosts | map('extract', hostvars, 'cluster_wan_ip') | select('defined') | list)
               + (firewall_extra_peer_ips | default([]))
               + (firewall_k3s_api_extra_allowed_ips | default([]))
             )
             | unique
             | list }}
        firewall_control_plane_network_ips: >-
          {{ (
               (firewall_control_plane_hosts | map('extract', hostvars, 'cluster_network_ip') | select('defined') | list)
               + (firewall_control_plane_hosts | map('extract', hostvars, 'cluster_wan_ip') | select('defined') | list)
             )
             | unique
             | list }}
      tags: [firewall]

    - name: Deploy nftables configuration from template
      ansible.builtin.template:
        src: nftables.conf.j2
        dest: "{{ '/etc/sysconfig/nftables.conf' if ansible_facts.os_family == 'RedHat' else '/etc/nftables.conf' }}"
        owner: root
        group: root
        mode: "0644"
        validate: nft -c -f %s
      notify: reload nftables
      tags: [firewall, config]

    - name: Ensure nftables service is enabled and started
      ansible.builtin.systemd:
        name: nftables
        enabled: true
        state: started
      tags: [firewall, persistence]
