---
# Retired: prefer roles/zswap (compressed cache + disk swap).
# Kept so old playbook references fail closed instead of reintroducing zram.
- name: Warn that zram role is retired
  ansible.builtin.debug:
    msg: >-
      roles/zram is retired. Use roles/zswap instead (Chris Down: prefer zswap;
      never run zram alongside disk swap).
  tags: [zram]

- name: Fail if zram role invoked while zswap is the configured default
  ansible.builtin.fail:
    msg: >-
      Refusing to configure zram. Set zswap_enable=false explicitly if you truly
      need a diskless zram-only setup (and pair it with systemd-oomd, no disk swap).
  when: zswap_enable | default(true) | bool
  tags: [zram]
