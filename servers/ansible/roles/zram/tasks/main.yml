---
- name: Install zram-generator
  ansible.builtin.dnf:
    name: zram-generator
    state: present
  when: zram_enable | default(true)
  tags: [zram]

- name: Configure zram-generator
  ansible.builtin.copy:
    dest: /etc/systemd/zram-generator.conf
    content: |-
      [zram0]
      # Cap at 8G: zram costs nothing until written, but beyond ~8G of
      # compressed spill the node is thrashing anyway; fail fast via OOM
      # instead of obtaining responsiveness on deep swap.
      zram-size = min(ram / 2, 8192)
      compression-algorithm = zstd
    owner: root
    group: root
    mode: "0644"
  notify: restart zram
  when: zram_enable | default(true)
  tags: [zram]

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  when: zram_enable | default(true)
  tags: [zram]

- name: Ensure zram service started
  ansible.builtin.systemd:
    name: systemd-zram-setup@zram0.service
    state: started
    enabled: true
  when: zram_enable | default(true)
  tags: [zram]
