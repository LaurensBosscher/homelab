---
- name: Decrypt OpenStick secrets
  ansible.builtin.command:
    argv:
      - sops
      - -d
      - --input-type
      - dotenv
      - --output-type
      - dotenv
      - "{{ openstick_secrets_file }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  check_mode: false
  no_log: true
  register: openstick_sops
  tags: [openstick, openstick_quadlets, openstick_cloudflared]

- name: Publish OpenStick secrets
  ansible.builtin.set_fact:
    openstick_cloudflared_token: "{{ (openstick_sops.stdout | regex_search('(?m)^OPENSTICK_CLOUDFLARED_TOKEN=(.*)$', '\\1'))[0] }}"
  delegate_to: localhost
  delegate_facts: true
  become: false
  run_once: true
  no_log: true
  tags: [openstick, openstick_quadlets, openstick_cloudflared]

- name: Use OpenStick secrets on this host
  ansible.builtin.set_fact:
    openstick_cloudflared_token: "{{ hostvars['localhost']['openstick_cloudflared_token'] }}"
  no_log: true
  tags: [openstick, openstick_quadlets, openstick_cloudflared]

- name: Assert OpenStick secrets are present
  ansible.builtin.assert:
    that:
      - openstick_cloudflared_token | length > 0
    fail_msg: >-
      OPENSTICK_CLOUDFLARED_TOKEN must be set in servers/ansible/secrets.enc.env.
  tags: [openstick, openstick_quadlets, openstick_cloudflared]
