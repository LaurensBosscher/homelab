---
# Bazzite root is an immutable composefs overlay with no free space.
# Put the zswap backing store on the writable NVMe-backed /var.
zswap_swapfile_path: /var/swapfile
k3s_selinux_enabled: true
# local-path PVC root. Same directory as /mnt/data/local-path (local-path-config).
# k3s-common points /var/lib/rancher/k3s/storage at this path so restic can
# mount one hostPath on every node.
k3s_local_path_storage: /var/mnt/data/local-path
k3s_local_path_fcontext: /mnt/data/local-path(/.*)?
# OpenStick USB clients (192.168.5.0/24) may use this host as a backup
# gateway when the stick's Wi-Fi path is down. The homelab forward chain
# drops that traffic unless it is allowed, and the router has no route back
# to the USB subnet, so masquerade it out the LAN NIC.
firewall_openstick_backup: true
firewall_openstick_usb_cidr: 192.168.5.0/24
firewall_lan_interface: enp2s0
# Hub and agent images built from LaurensBosscher/beszel kubernetes-support.
# The token file is created on the host from the beszel-agent ServiceAccount
# and is not stored in git.
beszel_agent_image: "ghcr.io/laurensbosscher/beszel-agent:sha-64f5a49baf9a03c93f3b7712562be2bb58c6058c"
beszel_agent_extra_env:
  NODE_NAME: bazzite
  KUBERNETES_SERVER: https://127.0.0.1:6443
  KUBERNETES_SERVICE_ACCOUNT_TOKEN_FILE: /var/lib/beszel-agent/k8s/token
  KUBERNETES_CA_FILE: /var/lib/beszel-agent/k8s/ca.crt
