# kube-prometheus-stack values
kube-prometheus-stack:
  # K3s embeds these components; default ServiceMonitors / absent() rules are false positives.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  defaultRules:
    disabled:
      KubeControllerManagerDown: true
      KubeSchedulerDown: true
      KubeProxyDown: true
  # ArgoCD gets stuck on PreSync admission patch Jobs; Ignore is fine for homelab.
  prometheusOperator:
    admissionWebhooks:
      failurePolicy: Ignore
      patch:
        enabled: false
  kubelet:
    serviceMonitor:
      # Keep chart-default metrics_path label, then drop unreachable bazzite LAN IP.
      relabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - sourceLabels: [__address__]
          regex: 192\.168\.1\.104:.*
          action: drop
      cAdvisorRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - sourceLabels: [__address__]
          regex: 192\.168\.1\.104:.*
          action: drop
      probesRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - sourceLabels: [__address__]
          regex: 192\.168\.1\.104:.*
          action: drop
      resourceRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - sourceLabels: [__address__]
          regex: 192\.168\.1\.104:.*
          action: drop
  prometheus-node-exporter:
    prometheus:
      monitor:
        relabelings:
          - sourceLabels: [__address__]
            regex: 192\.168\.1\.104:.*
            action: drop
  prometheus:
    prometheusSpec:
      retention: 15d
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          memory: 2Gi
      # Host metrics for bazzite via Tailscale until node-ip is switched to 100.81.190.71.
      additionalScrapeConfigs:
        - job_name: node-exporter-bazzite-tailscale
          static_configs:
            - targets:
                - 100.81.190.71:9100
              labels:
                node: bazzite
                scrape_path: tailscale
  grafana:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    # Telegram bot token from SealedSecret telegram-bot
    # chatid must stay a quoted string in provisioning — env substitution of a
    # numeric id is unmarshaled as a number and crashes Grafana on boot.
    envValueFrom:
      TELEGRAM_BOT_TOKEN:
        secretKeyRef:
          name: telegram-bot
          key: token
    alerting:
      contactpoints.yaml:
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: telegram
            receivers:
              - uid: telegram
                type: telegram
                settings:
                  bottoken: $TELEGRAM_BOT_TOKEN
                  chatid: "1265937934"
                disableResolveMessage: false
      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: telegram
            group_by:
              - grafana_folder
              - alertname
  kube-state-metrics:
    # Do not pin image.tag above the chart default while on kube-prometheus-stack
    # 65.8.1 / kube-state-metrics 5.26.x: that chart hardcodes readiness to /readyz
    # on the metrics port (:8080). KSM >=2.14 serves /readyz only on telemetry
    # (:8081), which stalls the Deployment (two RS desired=1, ProgressDeadlineExceeded).
    # See prometheus-community/helm-charts#4981. Chart default (~2.13) is compatible
    # with the hardcoded probes; bump the parent chart when ready for Prometheus 3.x.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - source_matchers:
            - severity = critical
          target_matchers:
            - severity =~ warning|info
          equal:
            - namespace
            - alertname
        - source_matchers:
            - severity = warning
          target_matchers:
            - severity = info
          equal:
            - namespace
            - alertname
        - source_matchers:
            - alertname = InfoInhibitor
          target_matchers:
            - severity = info
          equal:
            - namespace
        - target_matchers:
            - alertname = InfoInhibitor
      route:
        group_by:
          - namespace
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: telegram
        routes:
          - receiver: "null"
            matchers:
              - alertname = Watchdog
          - receiver: "null"
            matchers:
              - alertname = InfoInhibitor
          # bazzite LAN InternalIP is not reachable from VPS Prometheus pods.
          # Host metrics are scraped via Tailscale additionalScrapeConfigs instead.
          - receiver: "null"
            matchers:
              - instance =~ "192\\.168\\.1\\.104:.*"
          # K3s false positives (also disabled via defaultRules; belt-and-suspenders)
          - receiver: "null"
            matchers:
              - alertname =~ "KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown"
      receivers:
        - name: "null"
        - name: telegram
          telegram_configs:
            - bot_token_file: /etc/alertmanager/secrets/telegram-bot/token
              chat_id: 1265937934
              parse_mode: HTML
              send_resolved: true
      templates:
        - /etc/alertmanager/config/*.tmpl
    alertmanagerSpec:
      secrets:
        - telegram-bot
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
metrics-server:
  args:
    - --kubelet-insecure-tls
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 200m
      memory: 256Mi
