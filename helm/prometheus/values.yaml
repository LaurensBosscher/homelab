# kube-prometheus-stack values
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 15d
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          memory: 2Gi
  grafana:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
  kube-state-metrics:
    # Chart 5.26.0 (kube-prometheus-stack 65.8.1) still probes /readyz on :8080.
    # From KSM >=2.14, /readyz lives on the telemetry port (:8081) and returns
    # 404 on the metrics port — that stalls the Deployment rollout (ProgressDeadlineExceeded)
    # with two ReplicaSets both desired=1. See prometheus-community/helm-charts#4981.
    image:
      tag: v2.19.1
    livenessProbe:
      httpGet:
        path: /livez
        port: 8080
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8081
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  alertmanager:
    enabled: false
metrics-server:
  args:
    - --kubelet-insecure-tls
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 200m
      memory: 256Mi
