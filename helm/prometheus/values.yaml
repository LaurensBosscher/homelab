# kube-prometheus-stack values
kube-prometheus-stack:
  # K3s embeds these components; default ServiceMonitors / absent() rules are false positives.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  defaultRules:
    disabled:
      KubeControllerManagerDown: true
      KubeSchedulerDown: true
      KubeProxyDown: true
  # ArgoCD gets stuck on PreSync admission patch Jobs. Disable webhooks entirely so
  # the operator does not wait for prometheus-*-admission TLS secret (patch job creates it).
  prometheusOperator:
    admissionWebhooks:
      enabled: false
    tls:
      enabled: false

  kubelet:
    serviceMonitor:
      # Kubelet serving certs are signed by k3s-server-ca, which is the pod
      # serviceaccount CA already referenced by this ServiceMonitor. Chart
      # 65.8.1 only honors this flag on /metrics; cAdvisor and probes stay
      # insecureSkipVerify in the upstream template.
      insecureSkipVerify: false
      # Keep chart-default metrics_path label, then drop unreachable bazzite LAN IP.
      relabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - sourceLabels: [__address__]
          regex: 192\.168\.1\.104:.*
          action: drop
      cAdvisorRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - sourceLabels: [__address__]
          regex: 192\.168\.1\.104:.*
          action: drop
      probesRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - sourceLabels: [__address__]
          regex: 192\.168\.1\.104:.*
          action: drop
      resourceRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - sourceLabels: [__address__]
          regex: 192\.168\.1\.104:.*
          action: drop
  prometheus-node-exporter:
    prometheus:
      monitor:
        relabelings:
          - sourceLabels: [__address__]
            regex: 192\.168\.1\.104:.*
            action: drop
  prometheus:
    prometheusSpec:
      # Public Cloudflare Tunnel URL so alert Source links are clickable.
      externalUrl: https://prometheus.bosscher.ch
      retention: 15d
      # Pin to control-plane: London agents can't reach ClusterIP/API from pods
      # (kubernetes_sd times out on 10.43.0.1), so Prometheus on london-* stays blind.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - bazzite
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          memory: 2Gi
      # Host metrics for bazzite via Tailscale until node-ip is switched to 100.81.190.71.
      additionalScrapeConfigs:
        - job_name: node-exporter-bazzite-tailscale
          static_configs:
            - targets:
                - 100.81.190.71:9100
              labels:
                node: bazzite
                scrape_path: tailscale
  grafana:
    grafana.ini:
      server:
        root_url: https://grafana.bosscher.ch
        domain: grafana.bosscher.ch
      users:
        # Proxy sign-up is the only open registration path (allow_sign_up stays false).
        auto_assign_org_role: Admin
      auth.proxy:
        enabled: true
        header_name: Cf-Access-Authenticated-User-Email
        header_property: email
        auto_sign_up: true
        # cloudflared pod CIDR. Requests from anywhere else keep the login form.
        whitelist: 10.42.0.0/16
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    # Telegram bot token from SealedSecret telegram-bot
    # chatid must stay a quoted string in provisioning — env substitution of a
    # numeric id is unmarshaled as a number and crashes Grafana on boot.
    envValueFrom:
      TELEGRAM_BOT_TOKEN:
        secretKeyRef:
          name: telegram-bot
          key: token
    alerting:
      contactpoints.yaml:
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: telegram
            receivers:
              - uid: telegram
                type: telegram
                settings:
                  bottoken: $TELEGRAM_BOT_TOKEN
                  chatid: "1265937934"
                disableResolveMessage: false
      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: telegram
            group_by:
              - grafana_folder
              - alertname
  kube-state-metrics:
    # Do not pin image.tag above the chart default while on kube-prometheus-stack
    # 65.8.1 / kube-state-metrics 5.26.x: that chart hardcodes readiness to /readyz
    # on the metrics port (:8080). KSM >=2.14 serves /readyz only on telemetry
    # (:8081), which stalls the Deployment (two RS desired=1, ProgressDeadlineExceeded).
    # See prometheus-community/helm-charts#4981. Chart default (~2.13) is compatible
    # with the hardcoded probes; bump the parent chart when ready for Prometheus 3.x.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - source_matchers:
            - severity = critical
          target_matchers:
            - severity =~ warning|info
          equal:
            - namespace
            - alertname
        - source_matchers:
            - severity = warning
          target_matchers:
            - severity = info
          equal:
            - namespace
            - alertname
        - source_matchers:
            - alertname = InfoInhibitor
          target_matchers:
            - severity = info
          equal:
            - namespace
        - target_matchers:
            - alertname = InfoInhibitor
      route:
        group_by:
          - namespace
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: telegram
        routes:
          - receiver: "null"
            matchers:
              - alertname = Watchdog
          - receiver: "null"
            matchers:
              - alertname = InfoInhibitor
          # bazzite LAN InternalIP is not reachable from VPS Prometheus pods.
          # Host metrics are scraped via Tailscale additionalScrapeConfigs instead.
          - receiver: "null"
            matchers:
              - instance =~ "192\\.168\\.1\\.104:.*"
          # K3s false positives (also disabled via defaultRules; belt-and-suspenders)
          - receiver: "null"
            matchers:
              - alertname =~ "KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown"
          # Ephemeral kubectl debug leftovers should not page Telegram.
          - receiver: "null"
            matchers:
              - pod =~ "node-debugger-.*"
      receivers:
        - name: "null"
        - name: telegram
          telegram_configs:
            - bot_token_file: /etc/alertmanager/secrets/telegram-bot/token
              chat_id: 1265937934
              parse_mode: HTML
              send_resolved: true
      templates:
        - /etc/alertmanager/config/*.tmpl
    alertmanagerSpec:
      # Public Cloudflare Tunnel URL for Alertmanager UI / silence links.
      externalUrl: https://alertmanager.bosscher.ch
      # Pin to control-plane: london-1 Tailscale↔API flaps make AM unreachable via CF.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - bazzite
      secrets:
        - telegram-bot
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
metrics-server:
  # Same CA as the kubelet serving certs (k3s-server-ca). Mounted into the pod
  # via the serviceaccount; chart 3.13.0 appends these args to its defaults.
  args:
    - --kubelet-certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  # Same as alertmanager — keep metrics API off flappy WAN agents during soak.
  nodeSelector:
    kubernetes.io/hostname: bazzite
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 200m
      memory: 256Mi
