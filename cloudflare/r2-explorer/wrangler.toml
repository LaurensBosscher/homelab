name = "r2-explorer"
account_id = "1ce5b40c4616a803216dff853ef6bc81"
compatibility_date = "2024-11-06"
main = "src/index.ts"
workers_dev = false

# Dashboard assets ship inside the r2-explorer package.
# Keep this above [[routes]]. Keys after that header belong to the route.
assets = { directory = "node_modules/r2-explorer/dashboard", binding = "ASSETS", html_handling = "auto-trailing-slash", not_found_handling = "single-page-application", run_worker_first = ["/api/*", "/share/*"] }

[[routes]]
pattern = "files.bosscher.ch"
custom_domain = true

[[r2_buckets]]
binding = "r2-explorer"
bucket_name = "r2-explorer"
