<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-label="Shortcut index lookup: URL windows to candidate StorageIDs to full Match" font-family="Geist, -apple-system, system-ui, 'SF Pro Text', Inter, 'Segoe UI', Roboto, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="12">
  <defs>
  <style type="text/css"><![CDATA[
    /* Self-contained: <img> SVGs do not inherit page CSS variables. */
    svg {
      --fg: #282728;
      --muted: #6b7280;
      --surface: #f3f4f6;
      --border: #d1d5db;
      --accent: #006cac;
      --c1: #006cac;
      --c2: #3d8ec0;
      --c3: #7eb0d4;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --fg: #eaedf3;
        --muted: #afb9ca;
        --surface: #2a3148;
        --border: #ab4b08;
        --accent: #ff6b01;
        --c1: #ff6b01;
        --c2: #ff9448;
        --c3: #ffb87a;
      }
      /* Soft white halo so labels stay readable on dark page backgrounds */
      text, tspan {
        filter:
          drop-shadow(0 0 1.2px rgba(255, 255, 255, 0.95))
          drop-shadow(0 0 3px rgba(255, 255, 255, 0.5));
      }
    }
  ]]></style>

    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="12" y="22" fill="var(--fg)" font-size="14" font-weight="600">ShortcutIndex lookup</text>
  <text x="12" y="40" fill="var(--muted)" font-size="11">DNS uses URLLowerCase = http:// + hostname</text>

  <rect x="12" y="56" width="100" height="44" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="62" y="76" text-anchor="middle" fill="var(--fg)" font-size="11">URLLowerCase</text>
  <text x="62" y="92" text-anchor="middle" fill="var(--muted)" font-size="10">http://host</text>

  <line x1="112" y1="78" x2="132" y2="78" stroke="var(--muted)" marker-end="url(#arr)"/>

  <rect x="132" y="56" width="110" height="44" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="187" y="76" text-anchor="middle" fill="var(--fg)" font-size="11">5-char windows</text>
  <text x="187" y="92" text-anchor="middle" fill="var(--muted)" font-size="10">sliding over URL</text>

  <line x1="242" y1="78" x2="262" y2="78" stroke="var(--muted)" marker-end="url(#arr)"/>

  <rect x="262" y="56" width="110" height="44" rx="8" fill="var(--surface)" stroke="var(--accent)"/>
  <text x="317" y="76" text-anchor="middle" fill="var(--fg)" font-size="11">map lookup</text>
  <text x="317" y="92" text-anchor="middle" fill="var(--muted)" font-size="10">5-gram → []ID</text>

  <line x1="372" y1="78" x2="392" y2="78" stroke="var(--muted)" marker-end="url(#arr)"/>

  <rect x="392" y="56" width="120" height="44" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="452" y="76" text-anchor="middle" fill="var(--fg)" font-size="11">candidate IDs</text>
  <text x="452" y="92" text-anchor="middle" fill="var(--muted)" font-size="10">union of hits</text>

  <line x1="512" y1="78" x2="532" y2="78" stroke="var(--muted)" marker-end="url(#arr)"/>

  <rect x="532" y="56" width="170" height="44" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="617" y="76" text-anchor="middle" fill="var(--fg)" font-size="11">Retrieve + full Match()</text>
  <text x="617" y="92" text-anchor="middle" fill="var(--muted)" font-size="10">false positives expected</text>

  <text x="12" y="130" fill="var(--muted)" font-size="11">Each rule is indexed under one rarest 5-gram of its shortcut — not every overlapping slice.</text>
  <text x="12" y="148" fill="var(--muted)" font-size="11">Typical OpenStick leftovers: ~10–40 candidates; adversarial max-length name: ~150 unique rules.</text>
</svg>
