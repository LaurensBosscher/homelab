name: Kubernetes Deployment Linter

on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '.github/workflows/kube-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBECTL_VERSION: 'v1.36.2'
  KUBECONFORM_VERSION: 'v0.8.0'

jobs:
  k8s-lint:
    name: Lint Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      # Gate that mirrors Argo CD: every apps/<name> directory is one Application.
      # Directories with a kustomization are built; the rest are applied file by
      # file (Argo CD never concatenates them, so neither do we). This is the
      # check that catches a stray or rotten line in a kustomization.
      - name: Render and validate every Argo CD source path
        run: |
          set -euo pipefail
          rc=0
          for dir in apps/*/; do
            dir="${dir%/}"
            if compgen -G "${dir}/kustomization.y*ml" > /dev/null; then
              echo "::group::kustomize build ${dir}"
              if ! kubectl kustomize "${dir}" > /tmp/render.yaml 2> /tmp/render.err; then
                cat /tmp/render.err
                echo "::error::${dir} failed to render"
                exit 1
              fi
              kubeconform -strict -ignore-missing-schemas -summary /tmp/render.yaml || rc=1
              echo "::endgroup::"
            else
              shopt -s nullglob
              files=("${dir}"/*.yml "${dir}"/*.yaml)
              shopt -u nullglob
              for file in "${files[@]}"; do
                echo "::group::validate ${file}"
                kubeconform -strict -ignore-missing-schemas -summary "${file}" || rc=1
                echo "::endgroup::"
              done
            fi
          done
          exit "$rc"

      - name: Check for deprecated API versions
        run: |
          rc=0
          DEPRECATED_PATTERNS=(
            "apiVersion: extensions/v1beta1"
            "apiVersion: apps/v1beta1"
            "apiVersion: apps/v1beta2"
            "apiVersion: batch/v1beta1"
            "apiVersion: networking.k8s.io/v1beta1"
          )
          while IFS= read -r manifest; do
            for pattern in "${DEPRECATED_PATTERNS[@]}"; do
              if grep -q "$pattern" "$manifest"; then
                echo "::error file=$manifest::deprecated API version: $pattern"
                rc=1
              fi
            done
          done < <(git ls-files 'apps/**/*.yml' 'apps/**/*.yaml' 'helm/**/*.yml' 'helm/**/*.yaml')
          [ "$rc" -eq 0 ] && echo "✅ No deprecated API versions found"
          exit "$rc"

      - name: Check for best practices
        run: |
          VIOLATIONS=0
          while IFS= read -r manifest; do
            if grep -q "kind: Deployment" "$manifest"; then
              if ! grep -q "resources:" "$manifest"; then
                echo "⚠️ $manifest: no resource limits/requests"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
              if ! grep -q "livenessProbe:" "$manifest" && ! grep -q "readinessProbe:" "$manifest"; then
                echo "⚠️ $manifest: no liveness or readiness probes"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            fi
            if grep -q "image:.*:latest" "$manifest"; then
              echo "⚠️ $manifest: uses 'latest' image tag"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done < <(git ls-files 'apps/**/*.yml' 'apps/**/*.yaml')
          echo "⚠️ Found $VIOLATIONS best practice violation(s) — warnings only"

      - name: Set up Ansible
        run: pip install "ansible-core>=2.17,<2.21"

      - name: Syntax-check Ansible playbooks
        working-directory: servers/ansible
        run: |
          ansible-playbook --syntax-check -i hosts.ini site.yml
          ansible-playbook --syntax-check -i hosts-openstick.ini openstick.yml

  notify-failure:
    needs: [k8s-lint]
    if: failure()
    uses: ./.github/workflows/notify-telegram-on-failure.yml
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    with:
      parent_workflow: ${{ github.workflow }}
