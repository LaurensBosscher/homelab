name: Deploy resume
run-name: ${{ github.ref_name }} (triggered by ${{ github.actor }}) deploy resume

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/resume/**"
      - ".github/workflows/deploy-resume.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare update tunnels & dns
    defaults:
      run:
        working-directory: cloudflare/resume

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  notify-failure:
    needs: [deploy]
    if: failure()
    uses: ./.github/workflows/notify-telegram-on-failure.yml
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    with:
      parent_workflow: ${{ github.workflow }}
